# Delta Change mensili per 20 anni dall'anno base 2025.
# Fonte: valori rappresentativi CMIP6 per pianura padana (lat ~45N), consenso multi-modello.
# Struttura: delta_t_c[mese_1_12], alpha_rain[mese_1_12], alpha_srad[mese_1_12], delta_rh[mese_1_12]
# per i 3 SSP, lineari nel tempo, da 0 a delta_20anni a +20 anni dall'anno_base.
# Il Delta viene scalato linearmente: delta_t_mese(h, m) = delta_t_20_mese[m] * h/20

anno_base:
  valore: 2025
  unita: "anno"
  assunzione: true
  motivazione: "Anno di riferimento della baseline storica (ultimo anno completo affidabile POWER)."
  verificato: false
  nota: ""

delta_ssp126:
  delta_t_c:
    valore: [0.5, 0.5, 0.6, 0.7, 0.8, 1.0, 1.1, 1.0, 0.9, 0.7, 0.6, 0.5]
    unita: "°C a +20 anni"
    assunzione: true
    motivazione: "Delta temperatura mensile a +20a per SSP1-2.6, pianura padana, consenso CMIP6 (Zappa et al. 2022, Lionello & Scarascia 2018)."
    verificato: false
    nota: "Valori rappresentativi. Applicazione additiva su tmax/tmin/tmean."
  alpha_rain:
    valore: [0.98, 0.97, 0.98, 0.97, 0.96, 0.92, 0.88, 0.90, 0.95, 0.98, 0.99, 0.99]
    unita: "- a +20 anni (moltiplicatore)"
    assunzione: true
    motivazione: "Alpha precipitazione mensile a +20a per SSP1-2.6, pianura padana. Riduzione estiva moderata."
    verificato: false
    nota: "Moltiplicatore: rain_futura = alpha * rain_storica."
  alpha_srad:
    valore: [1.0, 1.0, 1.0, 1.01, 1.01, 1.02, 1.02, 1.01, 1.01, 1.0, 1.0, 1.0]
    unita: "- a +20 anni"
    assunzione: true
    motivazione: "Alpha radiazione solare a +20a SSP1-2.6. Variazione modesta."
    verificato: false
    nota: ""
  delta_rh:
    valore: [-0.5, -0.5, -0.5, -0.6, -0.8, -1.5, -2.0, -1.8, -1.0, -0.6, -0.5, -0.4]
    unita: "% a +20 anni (additivo su RH)"
    assunzione: true
    motivazione: "Delta umidità relativa mensile a +20a SSP1-2.6."
    verificato: false
    nota: ""

