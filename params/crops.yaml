      url: "https://www.fao.org/4/x0490e/x0490e0b.htm"
      nota: "Nota 1 della tab. 12: valore generico; con bagnature frequenti Kc ini cresce fino a 1.0-1.2 e va stimato con fig. 29-30 / eq. 59. In un modello con evaporazione separata dal suolo nudo (sezione suolo_nudo) va trattato come valore tabellare di riferimento."
      verificato: true
      sensibilita: true
    mid:
      valore: 1.20
      unita: "-"
      fonte: "Allen, Pereira, Raes, Smith (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56"
      riferimento: "Tabella 12, riga Maize, Field (grain) (field corn)"
      url: "https://www.fao.org/4/x0490e/x0490e0b.htm"
      nota: "Clima sub-umido standard (RHmin 45%, u2 2 m/s); correzione climatica con eq. 62 nel codice usando h_max."
      verificato: true
    end:
      valore: 0.60
      unita: "-"
      fonte: "Allen, Pereira, Raes, Smith (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56"
      riferimento: "Tabella 12, riga Maize, Field (grain), Kc end 0.60-0.35, nota 11"
      url: "https://www.fao.org/4/x0490e/x0490e0b.htm"
      nota: "Nota 11: 0.60 per raccolta a umidità della granella alta, 0.35 dopo essiccazione completa in campo (~18%). Scelto 0.60 perché il ciclo simulato termina alla maturità fisiologica (granella ancora umida); dopo, il campo passa a suolo nudo. Eq. 65 (correzione climatica) si applica perché > 0.45."
