    nota: "Con residui o pacciamatura Kc ini si riduce di circa il 5% per ogni 10% di superficie coperta (stesso capitolo). Le figure 29-30 sono grafici: non ne ho letto valori numerici. In alternativa si usa il bilancio dello strato evaporante (voci sotto)."
