# Parametri colturali FIELDWISE — mais da granella, soia, frumento tenero autunnale
# Contratto: params/SCHEMA.md. Fonti dettagliate: docs/fonti_crops.md
_meta:
  descrizione: "Parametri colturali per mais da granella (FAO 600), soia (gruppi 0+/I+) e frumento tenero a semina autunnale, Pianura Padana (provincia di Cremona, lat 45.2 lon 10.0)"
  compilato_il: "2026-11-11"
  metodo_gdd: >-
    GDD giornaliero = max(0, min(Tmedia, t_upper) - t_base), con Tmedia = media giornaliera (T2M di NASA POWER o (Tmax+Tmin)/2).
    È il "Method 1" del manuale AquaCrop (Raes et al., Reference Manual Chapter 3, v7.3, par. 3.3.1): Tavg limitata a [Tbase, Tupper].
    AquaCrop usa di default il "Method 3" (solo Tmax limitata a Tupper prima della media). Le due formule coincidono quando
    Tmax <= Tupper e Tmedia >= Tbase; con il metodo 1 i giorni con Tmax > Tupper danno un poco più di GDD.
    Le soglie t_base / t_upper sono quelle di AquaCrop (annesso I), quindi coerenti con questa formula.
  metodo_soglie_fenologiche: >-
    (1) gdd_maturita: durata totale della riga scelta di FAO-56 tab. 11 convertita in gradi-giorno con il clima di Cremona
    (NASA POWER T2M, 2001-2023, semina alla data tipica), accettata se cade nell'intervallo AquaCrop (annesso I) per
    "emergenza + lunghezza del ciclo"; altrimenti portata al limite dell'intervallo AquaCrop (solo il mais: 2055 -> 1950).
    (2) gdd_fine_ini, gdd_fine_sviluppo, gdd_fine_mid: stesse proporzioni termiche della tab. 11 nello stesso clima
    (frazione di GDD cumulati a fine fase sul totale del ciclo di tab. 11), moltiplicate per gdd_maturita.
    Controllo: gdd_fine_mid cade nell'intervallo AquaCrop "inizio senescenza" per tutte e tre le colture.
    (3) gdd_fioritura: intervallo AquaCrop "emergenza + semina-fioritura", preso nella stessa posizione relativa che
    gdd_maturita occupa nell'intervallo AquaCrop della maturità.
    Script di calcolo e serie meteo usate solo come supporto alla conversione (non sono la fonte dei valori).
  controllo_plausibilita: >-
    Con POWER 2001-2023 a Cremona (Tmedia mensile gen 3.0, apr 12.7, lug 25.7, ott 14.7 °C): mais seminato 15/4 ->
    maturità fisiologica in media a 144 gg (125-164), mediana 7/9, fioritura 88 gg (12/7); soia 5/5 -> 142 gg (122-160),
    mediana 23/9; frumento 30/10 -> 240 gg (225-255), mediana 25/6, antesi 186 gg (5/5).
  frumento_inverno: >-
    Il motore non modella vernalizzazione né fotoperiodo. Con t_base 0 °C il frumento accumula GDD anche in inverno
    (dic-feb circa 3-5 GDD/giorno). Le soglie sono ricavate dal calendario reale (tab. 11, riga Mediterranean, 240 gg con
    la lunga fase di sviluppo invernale di 140 gg), quindi i GDD invernali sono già inclusi nelle somme: nelle annate tipiche
    il calendario torna. Limite: in inverni più miti il modello anticipa le fasi più della realtà (la dormienza e il
    fabbisogno di vernalizzazione non sono rappresentati). AquaCrop (annesso I, I.10) dichiara la sua taratura valida per
    il frumento invernale "in the absence of a cold period below 5 GDD"; FAO-66 (sez. 3.4, Wheat) nota che periodi
    prolungati sotto 5 °C possono indurre dormienza.

mais:
