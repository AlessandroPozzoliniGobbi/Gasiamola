humus:
  incremento_c_suolo_medio:
    valore: 300
    unita: "kg C/ha/anno"
    fonte: "Bechini et al. (a cura di) (2020), Cover crop: schede tecniche per la coltivazione (BENCO)"
    riferimento: "Scheda 7, par. 7.1 'Sostanza organica', p. 71"
    url: "https://air.unimi.it/retrieve/dfa8b9a5-4f42-748b-e053-3a05fe0a3a96/H07%20Cover%20crop%20schede%20tecniche%20coltivazione_LR.pdf"
    nota: "Sintesi di esperimenti citata nella scheda: incrementi annui molto variabili, raramente > 3000 e spesso < 500 kg C/ha/anno; 'il valore medio e' di circa 300 kg C ha-1 anno-1' (+9% di sostanza organica rispetto ai controlli). Media su tutte le specie e durate, non specifica della segale."
    verificato: true
    sensibilita: true
  coefficiente_isoumico:
    valore: 0.039
    unita: "kg C umificato / kg C apportato"
    fonte: "Duparque A., Ancelin O., Duranel J., Dersigny C., Fleutry L. (2007). Mémento Sols et Matières Organiques. Agro-Transfert Ressources et Territoires e Chambres d'Agriculture de Picardie"
    riferimento: "p. 19, Tableau 2 'Valeurs du coefficient k1', riga 'Engrais vert', colonna 'Modèle HD' (0,039; modello AMG 0,076); fonte primaria indicata: Wylleman 1999"
    url: "https://www.agro-transfert-rt.org/wp-content/uploads/2025/08/Memento_sols_et_matiere_organique.pdf"
    nota: "Stessa tabella e stesso modello (Hénin-Dupuis, base carbonio) dei k1 dei residui colturali in nitrogen.yaml, quindi confrontabile con k2 di nitrogen.suolo.k2. Uso: H_cov = 0,039 x biomassa_secca x frazione_carbonio_sostanza_secca x 1,724 = 0,088 t SO/ha per 2,9 t s.s. (nitrogen._meta.equazioni.humus_henin_dupuis). Il valore precedente 0,23 (assunzione: 300 kg C/ha/anno di incremento netto, BENCO 7.1, diviso per il C della segale) non e' un k1 perche' incorpora gia' la mineralizzazione e altre specie e durate; resta come estremo superiore dell'intervallo. 'Engrais vert' e' un sovescio generico: per una graminacea con C/N 25 il valore e' probabilmente prudente (paglia di frumento 0,094, stessa tabella)."
    verificato: true
    sensibilita: true
    intervallo: [0.039, 0.23]
