# FIELDWISE - cover crop invernale (intervallo autunno-inverno tra cereale/soia e coltura primaverile)
# Specie scelta: segale (Secale cereale). Fonti in dettaglio: docs/fonti_rotation_heat_cover.md

_meta:
  descrizione: "Specie e parametri della cover crop autunno-vernina per la provincia di Cremona"
  compilato_il: "2026-11-11"
  scelta_specie: >-
    Segale (Secale cereale, Poaceae). Motivi, tutti dalle fonti lette: (1) e' tra le specie ammesse
    dall'intervento regionale SRA06 'Cover crops' del CSR Lombardia 2023-2027, il cui obiettivo dichiarato e'
    'la riduzione della lisciviazione dei nitrati'; (2) nelle schede tecniche del progetto lombardo BENCO
    (UniMi/Condifesa, PSR Lombardia) avena e segale sono le graminacee 'maggiormente impiegate' come catch
    crop; (3) nella prova lombarda di due epoche di semina la segale e' 'la specie che ha risentito meno del
    ritardo di semina' (BENCO Scheda 3, Fig. 3.2): e' decisivo perche' dopo mais da granella o soia la semina
    avviene a fine settembre-ottobre; (4) e' ingeliva (BENCO Scheda 4), quindi resta attiva fino alla
    terminazione di fine inverno, mentre avena strigosa e senape gelano e rilasciano N gia' in inverno
    (BENCO 5.2: la senape a fine inverno conserva circa il 40% dell'N di novembre); (5) le non leguminose
    riducono la lisciviazione piu' delle leguminose (BENCO 6.4). Svantaggio documentato: C/N alto (25.4)
    -> immobilizzazione di N per la coltura successiva (Npd negativo): il mais dopo segale richiede N in
    presemina (BENCO 5.3). La loiessa e' ammessa da SRA06 ma nelle fonti lette non ha dati lombardi di
    biomassa o N.
  regole_d_uso: >-
    La cover crop si semina solo se il calendario agronomico lo consente (calendario_agronomico: semina tra
    semina_inizio_ottimale e semina_max, terminazione a terminazione_tipica e prima della semina successiva,
    durata_minima_giorni); i requisiti del premio SRA06 (requisiti_sra06) non decidono il calendario ma producono
    un'avvertenza se non rispettati. Non conta ai fini dell'avvicendamento (rotation_rules) e non interrompe un
    ristoppio. Azoto e humus seguono nitrogen._meta.equazioni (passo 3bis e humus_henin_dupuis): a passo giornaliero
    l'assorbimento della segale e' n_assorbito x (ETa/ET0 del giorno normalizzato sul periodo della cover),
    limitato ogni giorno dall'N minerale presente (il tetto 0,70 x N_min della versione a fine segmento non si
    usa piu'), e sottratto alla lisciviazione; la biomassa prodotta e'
    proporzionale all'N assorbito, SS_cov = biomassa_secca x U_cov / n_assorbito (C/N costante), e SS_cov
    sostituisce biomassa_secca nell'immobilizzazione e nell'humus; alla terminazione l'N della biomassa passa
    a N_res e torna a N_min in nitrogen.suolo.residui.giorni_rilascio giorni; npd_per_t_ss x SS_cov (negativo per la segale) e' immobilizzato da N_min, con efficienza_campo
    solo se positivo; humus formato = humus.coefficiente_isoumico x C(SS_cov) x 1,724. Acqua: radici lineari
    da acqua.profondita_radicale_iniziale a acqua.profondita_radicale_max lungo l'intervallo coperto; Curve
    Number della classe acqua.classe_curve_number.
  limiti: >-
    Biomassa, C/N e Npd vengono da 2 anni di prove in 4 aziende lombarde (BENCO/COCROP), non da Cremona; i
    valori sono medie e dipendono molto da data di semina e piovosita' autunnale. L'N assorbito e' derivato;
    il coefficiente isoumico e' quello generico dei sovesci (Mémento 2007), non specifico della segale.

