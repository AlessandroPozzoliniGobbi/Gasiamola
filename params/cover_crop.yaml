acqua:
  kc:
    valore: 0.70
    unita: "-"
    fonte: "Allen, Pereira, Raes, Smith (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56"
    riferimento: "Tabella 12, Small grain cereals, Winter Wheat with non-frozen soils, Kc ini"
    url: "https://www.fao.org/4/x0490e/x0490e0b.htm"
    nota: "La segale non e' in Tabella 12: si usa per analogia il frumento autunnale su suolo non gelato (0.4 con suolo gelato). Si usa Kc ini costante perche' la segale cover e' terminata a fine inverno, prima della levata, quando la Tabella 12 prevede la salita verso Kc mid = 1.15. Il valore puo' crescere con bagnature frequenti (nota 1 della tabella)."
    verificato: true
    sensibilita: true
    intervallo: [0.4, 0.7]
  profondita_radicale_max:
    valore: 1.0
    unita: "m"
    fonte: "Allen et al. (1998), FAO-56"
    riferimento: "Tabella 22, Barley / Oats / Spring Wheat Zr 1.0-1.5 m; Winter Wheat 1.5-1.8 m"
    url: "https://www.fao.org/4/x0490e/x0490e0e.htm"
    nota: "Segale non tabulata. Si prende l'estremo inferiore dei cereali a paglia (1.0 m) perche' la cover vive circa 5-6 mesi, in buona parte d'inverno, e viene terminata prima della levata: i valori FAO sono profondita' massime a fine ciclo (1.5-1.8 m per il frumento autunnale). BENCO Scheda 7 descrive le graminacee come apparato 'fascicolato' con effetti piu' superficiali."
    verificato: true
    sensibilita: true
    intervallo: [1.0, 1.8]
  frazione_p:
    valore: 0.55
    unita: "-"
    fonte: "Allen et al. (1998), FAO-56"
    riferimento: "Tabella 22, cereali a paglia (Barley, Oats, Wheat) p = 0.55 per ETc circa 5 mm/d"
    url: "https://www.fao.org/4/x0490e/x0490e0e.htm"
    nota: "Correzione FAO-56: p = 0.55 + 0.04 (5 - ETc), limitata a [0.1, 0.8]; con l'ETc invernale bassa p sale verso 0.7-0.8."
    verificato: true
  kcb:
    ini:
      valore: 0.15
      unita: "-"
      fonte: "Allen, Pereira, Raes, Smith (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56"
      riferimento: "Cap. 7, Tabella 17 (Kcb per colture non stressate, clima sub-umido), righe Barley, Oats, Winter Wheat (Kcb ini 0.15)"
      url: "https://www.fao.org/4/x0490e/x0490e0c.htm"
      nota: "Segale non tabulata: per analogia con i cereali autunno-vernini (orzo, avena, frumento autunnale con copertura < 10%). Il motore usa Kcb ini costante, come kc (la segale e' terminata prima della levata); il riparto dell'assorbimento segue quindi Ks x ET0."
      verificato: true
      sensibilita: true
      intervallo: [0.15, 0.5]
    mid:
      valore: 1.1
      unita: "-"
      fonte: "Allen, Pereira, Raes, Smith (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56"
      riferimento: "Cap. 7, Tabella 17 (Kcb per colture non stressate, clima sub-umido), righe Barley, Oats, Winter Wheat"
      url: "https://www.fao.org/4/x0490e/x0490e0c.htm"
      nota: "Per analogia; non usato dal motore (cover terminata prima della piena stagione)."
      verificato: true
      sensibilita: true
    end:
      valore: 0.15
      unita: "-"
      fonte: "Allen, Pereira, Raes, Smith (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56"
      riferimento: "Cap. 7, Tabella 17 (Kcb per colture non stressate, clima sub-umido), righe Barley, Oats"
      url: "https://www.fao.org/4/x0490e/x0490e0c.htm"
      nota: "Per analogia; non usato dal motore."
      verificato: true
      sensibilita: true
  profondita_radicale_iniziale:
    valore: 0.3
    unita: "m"
    nota: "Usata da water.cover_daily_curves (zr_ini) nel motore di rotazione: radici lineari da questo valore a profondita_radicale_max tra semina e terminazione della segale."
    verificato: false
    assunzione: true
    motivazione: "FAO-56 (cap. 8, ricordato e non riletto) indica come profondita' iniziale Zr,min 0.15-0.20 m per le colture annuali seminate, ma i valori da 0.3 m sono gli stessi usati in crops.yaml (zr_ini = 0.3 per mais, soia e frumento) per tenere lo strato evaporante e lo strato radicale iniziale coerenti con lo strato 1 del suolo. Per coerenza con le colture principali si usa 0.3 m; nessuna fonte specifica per la segale da cover."
    sensibilita: true
    intervallo: [0.15, 0.3]
  classe_curve_number:
    valore: "cereali_a_paglia"
    unita: "-"
    nota: "Chiave di soil.ruscellamento (colture_a_file, cereali_a_paglia, suolo_nudo) usata per il CN nei giorni di cover. Coerente con water.cn_class('cover')."
    verificato: false
    assunzione: true
    motivazione: "Le tabelle SCS/USDA del Curve Number non hanno una riga per la segale da cover: per analogia la segale (cereale autunno-vernino seminato fitto, a file strette) si assegna ai cereali a paglia (small grain), come il frumento. Alternativa per sensibilita': suolo_nudo nei primi mesi, quando la copertura e' ancora scarsa."
    sensibilita: true

calendario_agronomico:
  # Calendario usato dal MOTORE per decidere se e quando c'e' la segale (non dipende dal premio SRA06).
  semina_inizio_ottimale:
    valore: "08-25"
    unita: "MM-DD"
    fonte: "Bechini L., Marino Gallina P., Michelon L., Tadiello T. (a cura di) (2020). Cover crop: schede tecniche per la coltivazione. Universita' degli Studi di Milano - Condifesa Lombardia Nord-Est, progetto BENCO (PSR Lombardia 2014-2020, Op. 1.2.01)"
    riferimento: "Scheda 3, par. 3.2 'Come scegliere la data di semina?', p. 33"
    url: "https://air.unimi.it/retrieve/dfa8b9a5-4f42-748b-e053-3a05fe0a3a96/H07%20Cover%20crop%20schede%20tecniche%20coltivazione_LR.pdf"
    nota: "Testo: 'la semina delle cover crop autunno-vernine puo' gia' essere condotta tra la fine del mese di agosto e l'inizio del mese di settembre'. 'Fine agosto' convertito in 25 agosto (conversione approssimata)."
    verificato: true
  semina_oltre_cui_cala_la_produttivita:
    valore: "09-15"
    unita: "MM-DD"
    fonte: "Bechini et al. (a cura di) (2020), Cover crop: schede tecniche per la coltivazione (BENCO)"
    riferimento: "Scheda 3, par. 3.2, p. 33 e Fig. 3.2"
    url: "https://air.unimi.it/retrieve/dfa8b9a5-4f42-748b-e053-3a05fe0a3a96/H07%20Cover%20crop%20schede%20tecniche%20coltivazione_LR.pdf"
    nota: "'Semine oltre la meta' di settembre generalmente comportano una minore produttivita' per quasi tutte le specie'; la segale e' la meno penalizzata. Non e' un divieto: il motore puo' seminare piu' tardi, ma la biomassa di riferimento (2.9 t) vale per semine di settembre."
    verificato: true
  semina_max:
    valore: "10-31"
    unita: "MM-DD"
    fonte: "Bechini et al. (a cura di) (2020), Cover crop: schede tecniche per la coltivazione (BENCO)"
    riferimento: "Scheda 8, Tabella 8.1 'Periodi di semina e durata potenziale di cover crop utili per il contenimento della flora infestante', riga 'Settembre-ottobre / Giugno / Segale e altri cereali autunno vernini, veccia vellutata', p. 82"
    url: "https://air.unimi.it/retrieve/dfa8b9a5-4f42-748b-e053-3a05fe0a3a96/H07%20Cover%20crop%20schede%20tecniche%20coltivazione_LR.pdf"
    nota: "Fine della finestra di semina della segale (settembre-ottobre). Dopo questa data il motore non semina la cover. La biomassa di riferimento (2,9 t s.s./ha) vale per semine di settembre: con semine di ottobre e' probabilmente sovrastimata (Tab. 8.2: segale seminata a inizio o meta' settembre 0,9-2,2 t a fine novembre)."
    verificato: true
    sensibilita: true
  terminazione_tipica:
    valore: "03-31"
    unita: "MM-DD"
    fonte: "Bechini et al. (a cura di) (2020), Cover crop: schede tecniche per la coltivazione (BENCO)"
    riferimento: "Scheda 5, par. 5.3 (simulazione: 'il 31 marzo come data di incorporazione delle cover crop nel suolo'; mais seminato il 15 aprile); Tab. 5.1 campionamenti 15-30 marzo"
    url: "https://air.unimi.it/retrieve/dfa8b9a5-4f42-748b-e053-3a05fe0a3a96/H07%20Cover%20crop%20schede%20tecniche%20coltivazione_LR.pdf"
    nota: "Per la segale la terminazione deve precedere la levata: il C/N supera circa 20 'all'emergenza della foglia a bandiera' (Scheda 5.1). Con la soia (semina piu' tardiva) la terminazione puo' slittare ad aprile, ma i valori di biomassa e Npd qui riportati valgono per fine marzo."
    verificato: true
  durata_minima_giorni:
    valore: 151
    unita: "giorni"
    fonte: "Derivato da Bechini et al. (a cura di) (2020), BENCO: Tabella 8.1 (semina entro ottobre) e Scheda 5.3 (terminazione 31 marzo)"
    riferimento: "calcolo: dal 31 ottobre (calendario_agronomico.semina_max) al 31 marzo (terminazione_tipica) = 151 giorni"
    url: "https://air.unimi.it/retrieve/dfa8b9a5-4f42-748b-e053-3a05fe0a3a96/H07%20Cover%20crop%20schede%20tecniche%20coltivazione_LR.pdf"
    nota: "Durata minima agronomica: la segale si semina solo se tra la semina possibile (raccolta della coltura precedente, non prima di semina_inizio_ottimale) e la terminazione ci sono almeno 151 giorni, cioe' se la semina cade entro il 31 ottobre. Terminazione = terminazione_tipica, comunque prima della semina della coltura successiva."
    verificato: true
    derivato: true
    sensibilita: true
  compatibilita_con_crops:
    valore: "frumento -> segale -> mais: si; mais -> segale -> soia: si, se il mais e' raccolto entro il 31/10; soia -> frumento: no"
    unita: "-"
    fonte: "Derivato da questo file (calendario_agronomico) e dalle date di crops.yaml"
    riferimento: "crops.yaml: semina mais 04-15 (min 04-01), soia 05-05 (min 04-24), frumento 10-30 (min 10-15); maturita' da gdd_maturita"
    url: "https://air.unimi.it/retrieve/dfa8b9a5-4f42-748b-e053-3a05fe0a3a96/H07%20Cover%20crop%20schede%20tecniche%20coltivazione_LR.pdf"
    nota: "Controllo eseguito: (1) dopo il frumento (maturita' a fine giugno) la segale si semina dal 25/8 e si termina il 31/3, 15 giorni prima della semina del mais (04-15; con semina_min 04-01 la terminazione va anticipata e la biomassa cala); (2) dopo il mais (maturita' a settembre, raccolta 2-4 settimane dopo: la data di raccolta non e' modellata) la segale e' possibile solo se il mais e' raccolto entro il 31/10; terminazione 31/3, soia il 05-05 (35 giorni); (3) soia -> frumento: il frumento e' esso stesso la coltura autunno-vernina, nessuna cover."
    verificato: true
    derivato: true
requisiti_sra06:
  # Condizioni per il PREMIO dell'intervento regionale SRA06 (CSR Lombardia 2023-2027). Il motore NON le usa per
  # decidere il calendario: le mostra come avvertenza ('non ammissibile al premio SRA06') quando non sono rispettate.
  # Nella rotazione mais-soia-frumento: dopo il frumento (raccolta fine giugno) SRA06 chiede la semina entro 30 giorni
  # (fine luglio), fuori dalla finestra agronomica della segale (settembre-ottobre); tra la terminazione del 31/3 e la
  # semina della soia (5/5) passano 35 giorni contro i 30 ammessi.
  max_giorni_raccolta_semina:
    valore: 30
    unita: "giorni"
    fonte: "Regione Lombardia (2025). CSR PSP 2023-2027 - Specifiche tecniche interventi SRA anno 2025, Intervento SRA06 Cover crops"
    riferimento: "SRA06, 'Impegni', p. 11"
    url: "https://psr.regione.lombardia.it/attachments/file/view?hash=dcc3bc626dc8c417c1769471b65a4356930b2a915bfb06c85228700ea4eaa236&canCache=0"
    nota: "'La cover crop deve essere seminata entro trenta giorni dalla raccolta della coltura precedente'. Vincolo per ricevere il premio SRA06."
    verificato: true
  terminazione_non_prima_di:
    valore: "02-28"
    unita: "MM-DD"
    fonte: "Regione Lombardia (2025). Specifiche tecniche interventi SRA anno 2025, SRA06"
    riferimento: "SRA06, 'Impegni', p. 11"
    url: "https://psr.regione.lombardia.it/attachments/file/view?hash=dcc3bc626dc8c417c1769471b65a4356930b2a915bfb06c85228700ea4eaa236&canCache=0"
    nota: "'La cover crop autunno-vernina non puo' in ogni caso essere eliminata prima della fine di febbraio'."
    verificato: true
  max_giorni_terminazione_semina_successiva:
    valore: 30
    unita: "giorni"
    fonte: "Regione Lombardia (2025). Specifiche tecniche interventi SRA anno 2025, SRA06"
    riferimento: "SRA06, 'Impegni', p. 11"
    url: "https://psr.regione.lombardia.it/attachments/file/view?hash=dcc3bc626dc8c417c1769471b65a4356930b2a915bfb06c85228700ea4eaa236&canCache=0"
    nota: "'la semina della coltura successiva deve avvenire entro trenta giorni dalla terminazione della cover'."
    verificato: true
  durata_minima_giorni:
    valore: 120
    unita: "giorni"
    fonte: "Regione Lombardia (2025). Specifiche tecniche interventi SRA anno 2025, SRA06"
    riferimento: "SRA06, 'Impegni', p. 11"
    url: "https://psr.regione.lombardia.it/attachments/file/view?hash=dcc3bc626dc8c417c1769471b65a4356930b2a915bfb06c85228700ea4eaa236&canCache=0"
    nota: "'La presenza della cover in campo deve superare comunque 120 giorni'. Coerente con l'ER, dove le colture secondarie sono quelle con ciclo < 120 giorni."
    verificato: true
biomassa_e_azoto:
  biomassa_secca:
    valore: 2.9
