    nota: "Testo: 'in media la riduzione della lisciviazione dovuta alla presenza di cover crop non leguminose rispetto a un controllo senza cover crop e' del 56-70%'. Valore prudente = estremo inferiore. Le meta-analisi originali (Thapa et al. 2018: -56%; Tonitto et al. 2006: -70%, come riportate da Bechini 2024, slide 'Riduzione di lisciviazione') non sono state lette direttamente. Thapa: effetto significativo solo per semine agosto-ottobre e crescente con la biomassa. Da usare come controllo del bilancio N, non in aggiunta a n_assorbito."
    verificato: true
    sensibilita: true
    intervallo: [0.56, 0.70]
  npd_per_t_ss:
    valore: -3.4
    unita: "kg N / t s.s."
    fonte: "Bechini et al. (a cura di) (2020), Cover crop: schede tecniche per la coltivazione (BENCO)"
    riferimento: "Scheda 5, Tabella 5.1, riga Segale (Npd -10 kg N/ha; -3.4 kg N/t s.s.)"
    url: "https://air.unimi.it/retrieve/dfa8b9a5-4f42-748b-e053-3a05fe0a3a96/H07%20Cover%20crop%20schede%20tecniche%20coltivazione_LR.pdf"
    nota: "Azoto potenzialmente disponibile per la coltura successiva rispetto al suolo senza cover: negativo = immobilizzazione. Da incubazione di 168 giorni in condizioni ottimali. Nella simulazione per il mais (Fig. 5.3) la segale immobilizza fino a circa -35 kg/ha dopo 15 giorni, con saldo finale circa -11 kg/ha."
    verificato: true
    sensibilita: true
  quota_n_che_torna_alla_coltura_successiva:
    valore: -0.19
    unita: "frazione dell'N assorbito"
    fonte: "Derivato da Bechini et al. (2020), BENCO, Tabella 5.1"
    riferimento: "calcolo: Npd / n_assorbito = -10 / 51.4"
    url: "https://air.unimi.it/retrieve/dfa8b9a5-4f42-748b-e053-3a05fe0a3a96/H07%20Cover%20crop%20schede%20tecniche%20coltivazione_LR.pdf"
    nota: "Valore calcolato (dipende dalla frazione di C assunta). Per la segale nessuna quota dell'N catturato torna nella stagione successiva: il saldo e' negativo; l'N resta nella sostanza organica. Preferire npd_per_t_ss nel codice."
