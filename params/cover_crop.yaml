  rapporto_cn:
    valore: 25.4
    unita: "-"
    fonte: "Bechini et al. (a cura di) (2020), Cover crop: schede tecniche per la coltivazione (BENCO)"
    riferimento: "Scheda 5, Tabella 5.1, riga Segale"
    url: "https://air.unimi.it/retrieve/dfa8b9a5-4f42-748b-e053-3a05fe0a3a96/H07%20Cover%20crop%20schede%20tecniche%20coltivazione_LR.pdf"
    nota: ""
