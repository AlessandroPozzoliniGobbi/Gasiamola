    unita: "kg C umificato / kg C dei residui"
    fonte: "Duparque A., Ancelin O., Duranel J., Dersigny C., Fleutry L. (2007). Mémento Sols et Matières Organiques. Agro-Transfert Ressources et Territoires e Chambres d'Agriculture de Picardie"
    riferimento: "p. 19, Tableau 2, riga 'Pois protéagineux', colonna 'Modèle HD'"
    url: "https://www.agro-transfert-rt.org/wp-content/uploads/2025/08/Memento_sols_et_matiere_organique.pdf"
    nota: "La soia non è in tabella: si usa il pisello proteico (leguminosa da granella) come proxy. Valore letto per il pisello, non per la soia: verificato false perché per la soia il valore non è stato letto."
