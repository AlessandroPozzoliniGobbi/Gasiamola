soia:
  n_assorbito:
    valore: 78.7
    unita: "kg N/t granella"
    fonte: "Salvagiotti F., Cassman K.G., Specht J.E., Walters D.T., Weiss A., Dobermann A. (2008). Nitrogen uptake, fixation and response to fertilizer N in soybeans: A review. Field Crops Research 108(1): 1-13. doi:10.1016/j.fcr.2008.03.001"
    riferimento: "Fig. 1 e testo p. 4: pendenza media 12,7 kg granella (13% di umidità) per kg N assorbito nella parte aerea (0,0127 Mg/kg N), meta-analisi n = 480"
    url: "https://www.mssoy.org/sites/default/files/documents/nebraska-n-review-2008-ok.pdf"
    nota: "1000/12,7 = 78,7 kg N/t. Fa coppia con nhi (stessa fonte, Tab. 1). Controllo nel testo: 'a soybean crop yielding 5 Mg ha-1 accumulates about 400 kg N ha-1' (80 kg N/t). Sostituisce la coppia ER (63 ass. / 58,2 asp., NHI implicito 0,92) che, con l'HI 0,40 di crops.yaml, dava residui allo 0,37% di N contro l'1,21% medio di Salvagiotti (reports/params_review.md, punto 3). Con 78,7 e NHI 0,73: a 4,5 t/ha N nei residui 96 kg/ha su 5,9 t s.s., cioè 1,63% (Tab. 1: IQR 0,80-1,55, massimo 3,17). Alternativa ER in intervallo."
    verificato: true
    sensibilita: true
    intervallo: [63.0, 78.7]
  nhi:
    valore: 0.73
    unita: "kg N granella / kg N parte aerea"
    fonte: "Salvagiotti F., Cassman K.G., Specht J.E., Walters D.T., Weiss A., Dobermann A. (2008). Nitrogen uptake, fixation and response to fertilizer N in soybeans: A review. Field Crops Research 108(1): 1-13. doi:10.1016/j.fcr.2008.03.001"
    riferimento: "Tab. 1, riga 'N harvest index' (n = 216; media 0,73, 25% 0,64, 75% 0,82, min 0,38, max 0,97); testo p. 5"
    url: "https://www.mssoy.org/sites/default/files/documents/nebraska-n-review-2008-ok.pdf"
    nota: "Indice di raccolta dell'azoto, coerente con n_assorbito (stessa meta-analisi). Intervallo = IQR. ER implicito 58,2/63 = 0,92 (fuori IQR)."
    verificato: true
    sensibilita: true
    intervallo: [0.64, 0.82]
  n_asportato:
    valore: 57.5
    unita: "kg N/t granella"
    fonte: "Derivato da Salvagiotti et al. (2008), Field Crops Research 108: 1-13 (n_assorbito x nhi)"
    riferimento: "Fig. 1 (78,7 kg N/t) x Tab. 1 (NHI 0,73)"
    url: "https://www.mssoy.org/sites/default/files/documents/nebraska-n-review-2008-ok.pdf"
    nota: "78,7 x 0,73 = 57,5 kg N/t. Controllo: Regione Emilia-Romagna, Norme generali 2023, Allegato 6, 'Soia (granella)' 5,82 % = 58,2 kg N/t (p. 70), differenza 1%; Salvagiotti Tab. 1: N nella granella 6,34 % (IQR 6,00-6,75) e 63,4 kg N/t a Lincoln (p. 5). Intervallo dall'estremo derivato al valore di Lincoln."
    verificato: true
    derivato: true
    sensibilita: true
    intervallo: [57.5, 63.4]
  k1_residui:
