      valore: 365
      unita: "giorni"
      nota: "Nucleo giornaliero (fieldwise.nitrogen.run_daily): l'N dei residui che non va in humus (alla raccolta o alla terminazione della cover) e l'N immobilizzato (credito di precessione negativo alla semina successiva, Npd negativo della cover alla terminazione) passano a N_min con un rilascio uniforme in questo numero di giorni dall'evento. Sostituisce rilascio_completo_dopo_una_coltura (rilascio in blocco alla raccolta successiva, che esponeva tutto quell'azoto al drenaggio autunnale)."
      verificato: false
      assunzione: true
      motivazione: "Il disciplinare ER (Tab. 4) da' solo l'effetto netto sulla coltura successiva e nessuna durata; nessun coefficiente tempo e' nei parametri. Dodici mesi coprono la coltura successiva e il primo inverno, l'ordine di grandezza della decomposizione della frazione labile di stocchi e paglie in clima temperato; la forma uniforme e' la piu' semplice che conserva la massa."
      sensibilita: true
      intervallo: [180, 730]
  temperatura:
    q10:
      valore: 2.0
      unita: "-"
      nota: "Fattore giornaliero f_T = q10^((T - T_media)/10), T = temperatura media giornaliera dell'aria del meteo (proxy della temperatura del suolo), T_media = media della serie meteo, quindi media di f_T circa 1: il totale annuo di k2 (ER) non cambia, cambia la distribuzione nell'anno. Moltiplica la mineralizzazione dell'humus (passo 1) e scandisce il rilascio di N_res in giorni normalizzati (passo 1bis). q10 = 1 riproduce il motore senza temperatura."
      verificato: false
      assunzione: true
      motivazione: "Valore centrale della letteratura letta solo negli abstract: Stanford, Frere e Schwaninger (1973, Soil Science 115) Q10 circa 2 su 11 suoli tra 5 e 35 gradi C; Liu et al. (2016, Global Change Biology 22) media globale 2,21 su 379 studi; Miller et al. (2018, Biology and Fertility of Soils 54) 2,87 (2,67-3,15) su 55 suoli agricoli. Da verificare nei testi completi prima di marcarlo verificato."
      sensibilita: true
      intervallo: [1.7, 3.0]

