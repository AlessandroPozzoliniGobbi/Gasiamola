lisciviazione:
  anion_excl:
    valore: 0.50
    unita: "frazione della porosità"
    fonte: "Neitsch S.L., Arnold J.G., Kiniry J.R., Williams J.R. (2011). Soil and Water Assessment Tool Theoretical Documentation Version 2009. Texas Water Resources Institute TR-406; e Arnold J.G. et al. (2012) SWAT Input/Output File Documentation Version 2012"
    riferimento: "Theoretical Documentation, sez. 4:2.1 'Nitrate movement', eq. 4:2.1.2 e 4:2.1.8, p. 269; I/O Documentation, cap. 22 (.sol), variabile ANION_EXCL, p. 304: 'If no value for ANION_EXCL is entered, the model will set ANION_EXCL = 0.50'"
    url: "https://swat.tamu.edu/media/99192/swat2009-theory.pdf"
    nota: "Formula: L = N_min x (1 - exp(-D_seg / ((1 - anion_excl) x SAT_mm))). SWAT la applica per strato e per giorno; qui per giorno (D = percolazione profonda del giorno) e su un solo strato, il profilo del motore (vedi _meta.limiti). Documento I/O: https://swat.tamu.edu/media/69296/swat-io-documentation-2012.pdf. Scelto al posto di Burns (1975), il cui articolo non è ad accesso aperto. Ente: USDA-ARS / Texas A&M (fonte 'altro', dichiarata)."
    verificato: true
    sensibilita: true
    intervallo: [0.01, 1.0]
  metodo_disciplinare:
    # Solo controllo / dose da disciplinare (voce C, Allegato 2 ER)
    soglie_pioggia_autunno_inverno:
      valore: [150, 250]
      unita: "mm (pioggia 1 ottobre - 31 gennaio)"
      fonte: "Regione Emilia-Romagna, DG Agricoltura, caccia e pesca (2023). Disciplinari di produzione integrata 2023 - Norme generali"
      riferimento: "Allegato 2, voce C 'Perdite per lisciviazione', Ca, tabella, p. 54"
      url: "https://agricoltura.regione.emilia-romagna.it/produzioni-agroalimentari/agricoltura-sostenibile/agricoltura-integrata/Collezione-dpi/dpi_2023/norme/norme_generali-2023.pdf/@@download/file"
      nota: "Colture annuali: pioggia < 150 mm -> nessuna perdita; 150-250 mm -> perdita = N_pronto x (y - 150)/100; > 250 mm -> si perde tutto l'azoto pronto."
      verificato: true
      sensibilita: true
    perdita_uscita_inverno:
      valore: 0.1
      unita: "kg N/ha per mm di pioggia"
      fonte: "Regione Emilia-Romagna, DG Agricoltura, caccia e pesca (2023). Disciplinari di produzione integrata 2023 - Norme generali"
      riferimento: "Allegato 2, voce C, Cb 'perdite all'uscita dell'inverno', p. 54"
      url: "https://agricoltura.regione.emilia-romagna.it/produzioni-agroalimentari/agricoltura-sostenibile/agricoltura-integrata/Collezione-dpi/dpi_2023/norme/norme_generali-2023.pdf/@@download/file"
      nota: "Originale: '1 kg di N per ettaro ogni 10 mm di pioggia', conteggiata solo oltre i 250 mm cumulati (1 ottobre - fine febbraio)."
      verificato: true
      sensibilita: true
    soglia_uscita_inverno:
      valore: 250
      unita: "mm (pioggia 1 ottobre - 28/29 febbraio)"
      fonte: "Regione Emilia-Romagna, DG Agricoltura, caccia e pesca (2023). Disciplinari di produzione integrata 2023 - Norme generali"
      riferimento: "Allegato 2, voce C, Cb, p. 54"
      url: "https://agricoltura.regione.emilia-romagna.it/produzioni-agroalimentari/agricoltura-sostenibile/agricoltura-integrata/Collezione-dpi/dpi_2023/norme/norme_generali-2023.pdf/@@download/file"
