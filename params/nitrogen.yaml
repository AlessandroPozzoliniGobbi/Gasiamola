mais:
  n_assorbito:
    valore: 22.7
    unita: "kg N/t granella"
    fonte: "Regione Emilia-Romagna, DG Agricoltura, caccia e pesca (2023). Disciplinari di produzione integrata 2023 - Norme generali"
    riferimento: "Allegato 6, Coefficienti di assorbimento e asportazione, riga 'Mais da granella (pianta intera)', N = 2,27 %, tipo ass., p. 70"
    url: "https://agricoltura.regione.emilia-romagna.it/produzioni-agroalimentari/agricoltura-sostenibile/agricoltura-integrata/Collezione-dpi/dpi_2023/norme/norme_generali-2023.pdf/@@download/file"
    nota: "Valore originale 2,27 % (kg N per 100 kg di granella) -> x10 = 22,7 kg N/t. Coefficiente di assorbimento = granella + parti non raccolte. Umidità della granella non dichiarata nella tabella (presumibilmente commerciale). Il vecchio motore aveva un valore non citato."
    verificato: true
    sensibilita: true
  n_asportato:
    valore: 15.6
    unita: "kg N/t granella"
    fonte: "Regione Emilia-Romagna, DG Agricoltura, caccia e pesca (2023). Disciplinari di produzione integrata 2023 - Norme generali"
    riferimento: "Allegato 6, riga 'Mais da granella (granella)', N = 1,56 %, tipo asp., p. 70"
    url: "https://agricoltura.regione.emilia-romagna.it/produzioni-agroalimentari/agricoltura-sostenibile/agricoltura-integrata/Collezione-dpi/dpi_2023/norme/norme_generali-2023.pdf/@@download/file"
    nota: "1,56 % -> 15,6 kg N/t. Caso stocchi lasciati in campo. Quota esportata implicita = 15,6/22,7 = 0,69."
    verificato: true
    sensibilita: true
  k1_residui:
    valore: 0.126
