    intervallo: [0.094, 0.182]
  credito_precessione:
    valore: 0
    unita: "kg N/ha"
    fonte: "Regione Emilia-Romagna, DG Agricoltura, caccia e pesca (2023). Disciplinari di produzione integrata 2023 - Norme generali"
    riferimento: "Allegato 2, Tab. 4, riga 'Soia', p. 55"
    url: "https://agricoltura.regione.emilia-romagna.it/produzioni-agroalimentari/agricoltura-sostenibile/agricoltura-integrata/Collezione-dpi/dpi_2023/norme/norme_generali-2023.pdf/@@download/file"
    nota: "Il disciplinare non dà credito alla soia (contro 40 kg/ha per pisello e fagiolo). Coerente con Salvagiotti et al. (2008, p. 5): il bilancio parziale della soia è in media negativo (-40 kg N/ha) e il 'credito soia' delle raccomandazioni USA non è un guadagno netto di azoto."
    verificato: true
    sensibilita: true
  coefficiente_tempo:
    valore: 0.75
    unita: "-"
    fonte: "Regione Emilia-Romagna, DG Agricoltura, caccia e pesca (2023). Disciplinari di produzione integrata 2023 - Norme generali"
    riferimento: "Allegato 7, Tab. 2, riga 'Soia', p. 73"
    url: "https://agricoltura.regione.emilia-romagna.it/produzioni-agroalimentari/agricoltura-sostenibile/agricoltura-integrata/Collezione-dpi/dpi_2023/norme/norme_generali-2023.pdf/@@download/file"
    nota: "Solo per il calcolo 'da disciplinare'."
    verificato: true
  fissazione:
    quota_fissazione_max:
      valore: 0.86
      unita: "frazione dell'azoto assorbito (parte aerea)"
      fonte: "Salvagiotti F., Cassman K.G., Specht J.E., Walters D.T., Weiss A., Dobermann A. (2008). Nitrogen uptake, fixation and response to fertilizer N in soybeans: A review. Field Crops Research 108(1): 1-13. doi:10.1016/j.fcr.2008.03.001"
      riferimento: "Testo p. 5 (commento alla Fig. 2): 'When less than 85 kg N ha-1 was applied as fertilizer and N uptake levels were above 350 kg N ha-1, the proportion of N derived from biological fixation ranged from 35 to 86%, most likely due to differences in soil N supply capacity'; Tab. 1, 'N2 fixation (%)', riga 'No N': max 98, 75% 74, media 58, 25% 46"
      url: "https://www.mssoy.org/sites/default/files/documents/nebraska-n-review-2008-ok.pdf"
      nota: "Tetto della quota fissata nella forma di _meta.equazioni (passo 2): la soia usa prima N_disp e fissa il resto fino a 0,86 x U. Scelto l'estremo alto della classe di assorbimento > 350 kg N/ha, che è quella di una soia da 4,5 t/ha (U = 354 kg/ha); la variazione 35-86% è attribuita dalla fonte all'offerta di N del suolo, che nel motore è già N_disp. La media 0,58 dei controlli senza concime (valore della versione precedente) incorpora già l'N del suolo reale e non è un tetto: è il limite inferiore dell'intervallo; il massimo 0,98 il superiore. Con 0,86 la soia senza concime chiude il fabbisogno se N_disp >= 0,14 x U (50 kg/ha a 4,5 t/ha). Controllo con la regressione media della Fig. 2 (FIX = 0,66 U - 19, dosi < 10 kg N): a U = 354 FIX = 215 kg/ha (61%)."
      verificato: true
      sensibilita: true
      intervallo: [0.58, 0.98]
    coeff_inibizione_n:
      valore: 0.0098
      unita: "ha/kg N"
      fonte: "Salvagiotti F., Cassman K.G., Specht J.E., Walters D.T., Weiss A., Dobermann A. (2008). Nitrogen uptake, fixation and response to fertilizer N in soybeans: A review. Field Crops Research 108(1): 1-13. doi:10.1016/j.fcr.2008.03.001"
      riferimento: "Fig. 3, curva limite y = 337 e^(-0,0098 x): 'the maximum level of N2 fixation as a function of fertilizer-N rate', x = concime N (kg/ha) in pre-semina o nei primi 20 cm; testo p. 6"
      url: "https://www.mssoy.org/sites/default/files/documents/nebraska-n-review-2008-ok.pdf"
      usato_dal_motore: "no (2026-11-12): la soia non riceve concime nel motore, quindi il tetto in funzione della dose non si applica; con il concime la formula era circolare (FERT dipende da FIX e viceversa) e portava a dosi irrealistiche. Riportato come informazione."
      nota: "Nella fonte: tetto assoluto della fissazione in funzione della DOSE DI CONCIME, FIX <= fissazione_max_assoluta x exp(-coeff_inibizione_n x FERT). Non si applica più all'N minerale del suolo né alla quota media (la versione precedente lo faceva: assunzione rimossa, vedi reports/params_review.md, voce 29). Con FERT = 30 kg/ha (MAS soia) il tetto scende a 251 kg N/ha."
      verificato: true
      sensibilita: true
    fissazione_max_assoluta:
      valore: 337
      unita: "kg N/ha"
      fonte: "Salvagiotti F., Cassman K.G., Specht J.E., Walters D.T., Weiss A., Dobermann A. (2008). Nitrogen uptake, fixation and response to fertilizer N in soybeans: A review. Field Crops Research 108(1): 1-13. doi:10.1016/j.fcr.2008.03.001"
      riferimento: "Tab. 1 'N2 fixation (kg ha-1)' massimo; testo p. 5 (Herridge 1982 come massimo affidabile)"
      url: "https://www.mssoy.org/sites/default/files/documents/nebraska-n-review-2008-ok.pdf"
      usato_dal_motore: "no (2026-11-12): con FERT = 0 il tetto (337 kg N/ha) non è mai attivo perché quota_fissazione_max x U è più basso per le rese simulate; resta come controllo."
      nota: "Tetto di controllo: FIX non deve superare questo valore."
      verificato: true

