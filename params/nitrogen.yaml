    formula_machet:
      coeff_numeratore:
        valore: 1200
        unita: "-"
        fonte: "Duparque A., Ancelin O., Duranel J., Dersigny C., Fleutry L. (2007). Mémento Sols et Matières Organiques. Agro-Transfert Ressources et Territoires e Chambres d'Agriculture de Picardie"
        riferimento: "p. 20, Tableau 3, nota ** 'Equation k2 = 1200 / [(0,2*T-1)/[A+200).(0,3 CaCO3+200)]' (Machet et al. 1990)"
        url: "https://www.agro-transfert-rt.org/wp-content/uploads/2025/08/Memento_sols_et_matiere_organique.pdf"
        nota: "La formula stampata ha parentesi e barra sbagliate. La forma k2 = 1200 x (0,2 T - 1) / ((A+200)(0,3 CaCO3 + 200)), con A e CaCO3 in g/kg, riproduce la colonna 'Machet' della stessa tabella (es. limon calcaire A = 90, CaCO3 = 271 -> 0,015 con T ≈ 10 °C; argileux A = 302, CaCO3 = 2 -> 0,012). Alternativa a per_tessitura, utile perché è continua in argilla e temperatura. Fonte primaria (Machet et al. 1990) non consultata."
        verificato: true
        sensibilita: true
      coeff_temperatura:
        valore: [0.2, -1.0]
        unita: "[1/°C, -]"
        fonte: "Duparque A., Ancelin O., Duranel J., Dersigny C., Fleutry L. (2007). Mémento Sols et Matières Organiques. Agro-Transfert Ressources et Territoires e Chambres d'Agriculture de Picardie"
        riferimento: "p. 20, Tableau 3, nota ** (termine 0,2*T - 1)"
        url: "https://www.agro-transfert-rt.org/wp-content/uploads/2025/08/Memento_sols_et_matiere_organique.pdf"
        nota: "f(T) = 0,2 x T - 1 (T media annua dell'aria, °C). Tarata nel nord della Francia (T ≈ 10 °C): a Cremona (T ≈ 13 °C) è un'estrapolazione."
        verificato: true
        sensibilita: true
      offset_argilla:
        valore: 200
        unita: "g/kg"
        fonte: "Duparque A., Ancelin O., Duranel J., Dersigny C., Fleutry L. (2007). Mémento Sols et Matières Organiques. Agro-Transfert Ressources et Territoires e Chambres d'Agriculture de Picardie"
        riferimento: "p. 20, Tableau 3, nota ** (A + 200)"
        url: "https://www.agro-transfert-rt.org/wp-content/uploads/2025/08/Memento_sols_et_matiere_organique.pdf"
        nota: "A = argilla in g/kg (per mille). SoilGrids dà l'argilla in g/kg."
        verificato: true
      coeff_calcare:
        valore: [0.3, 200]
        unita: "[-, g/kg]"
        fonte: "Duparque A., Ancelin O., Duranel J., Dersigny C., Fleutry L. (2007). Mémento Sols et Matières Organiques. Agro-Transfert Ressources et Territoires e Chambres d'Agriculture de Picardie"
        riferimento: "p. 20, Tableau 3, nota ** (0,3 CaCO3 + 200)"
        url: "https://www.agro-transfert-rt.org/wp-content/uploads/2025/08/Memento_sols_et_matiere_organique.pdf"
        nota: "CaCO3 = calcare totale in g/kg. SoilGrids non lo fornisce: senza dato locale si pone 0 (k2 massimo per quell'argilla)."
        verificato: true
