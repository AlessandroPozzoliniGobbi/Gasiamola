# Parametri di azoto e sostanza organica (humus) per FIELDWISE.
# Contratto delle voci: params/SCHEMA.md. Fonti e note di lettura: docs/fonti_nitrogen.md.
# Colture: mais da granella, soia, frumento tenero. Area: Pianura Padana (provincia di Cremona).

_meta:
  descrizione: "Azoto (bilancio di massa del suolo) e humus (Hénin-Dupuis) per mais da granella, soia e frumento tenero in Pianura Padana"
  compilato_il: "2026-11-11"
  rivisto_il: "2026-11-12 (decisioni del responsabile dopo l'implementazione di nitrogen.py: soia senza concime e deficit_n, tetto e biomassa della cover proporzionali all'N assorbito, passo 2 che chiude il bilancio); 2026-11-12 (correzioni dopo reports/params_review.md: fissazione soia, coppia n_assorbito/NHI soia, efficienza del concime, cover crop nelle equazioni, strato dell'humus, k2 per C/N > 12, credito di precessione); 2026-11-12 (verifica del motore: soglie di C/N di k2 in suolo.k2_soglie_cn, riparto sulla traspirazione del bilancio idrico a doppio coefficiente, limiti aggiornati e misura della cover rifatta)"
  convenzioni:
    resa: "Le rese (t/ha) a cui si applicano i coefficienti per tonnellata sono di granella all'umidità commerciale (mais 14%, soia e frumento 13%, come in crops.yaml). Le tabelle ER (Allegato 6) non dichiarano l'umidità; la tabella MAS della Lombardia dice 'granella = all'umidità commerciale'. La soia in Salvagiotti et al. (2008) è al 13% di umidità."
    humus: "H è lo stock di sostanza organica (SO) del suolo in t SO/ha nello STRATO DELL'HUMUS, unico per tutto il motore: spessore suolo.profondita_humus (0,20 m), con SO% e densità apparente presi da soil.yaml (strati_soilgrids.s0_30.sostanza_organica e .densita_apparente). H = SO% / 100 x profondita_humus x 10000 x densita_apparente (t/ha)."
    strato_humus_e_strato_0_30: "Lo spessore 0,20 m è quello su cui il disciplinare ER ha derivato i coefficienti di mineralizzazione (Tab. 1 e nota, p. 53): k2 e n_humus riproducono la tabella solo su 20 cm. SO% e densità sono misurati o stimati su 0-30 cm (ERSAF, SoilGrids) e si assumono uniformi nello strato lavorato: lo stesso SO% vale per 0-20. I 10 cm tra 20 e 30 cm (un terzo dello stock 0-30) restano fuori dal bilancio dell'humus: non mineralizzano e non ricevono humus dai residui (stima prudente della mineralizzazione). Il modello idrico usa lo strato 0-30 cm di soil.yaml con la SO iniziale fissa: la variazione di H non retroagisce su fc e wp. Per confronto con lo stock 0-30: H(0-30) = 1,5 x H(0-20)."
    tempo: "anni_seg = giorni del segmento / 365. Azoto e humus si aggiornano a passo giornaliero (tassi annui / 365); le voci per segmento sono somme giornaliere."
    credito_precessione_e_resa: "Il credito di precessione (Tab. 4 ER) agisce SOLO sull'azoto (concime richiesto, N_min). NON va combinato con un fattore di resa per precessione favorevole (rotation_rules.precessione_favorevole), che misura in parte lo stesso effetto azoto: sarebbe un doppio conteggio."
  equazioni:
    stati: |
      N_min  [kg N/ha]  azoto minerale nel profilo radicale
      N_res  [kg N/ha]  azoto organico dei residui freschi (colture e cover) non ancora mineralizzati
      N_cov  [kg N/ha]  azoto nella biomassa della cover crop viva (solo durante l'intercoltura con cover)
      N_pl   [kg N/ha]  azoto nella coltura in piedi tra semina e raccolta (serve alla chiusura giornaliera)
      H      [t SO/ha]  humus (sostanza organica stabile) nello strato dell'humus (0-0,20 m)
      N_hum  [kg N/ha]  = H x n_humus x 1000  (azoto contenuto nell'humus; non è uno stato indipendente)
    humus_henin_dupuis: |
      Stock iniziale (strato dell'humus, vedi _meta.convenzioni):
        H0 = SO%(soil.s0_30) / 100 x profondita_humus x 10000 x densita_apparente(soil.s0_30)
      Mineralizzazione dell'humus nel segmento, con il tetto ER oltre il 3% di SO
      (Tab. 1 ER: 'rimane costante per tenori di S.O. superiori al 3%'):
        H_tetto = soglia_so_tetto / 100 x profondita_humus x 10000 x densita_apparente
        H_min = k2 x min(H, H_tetto) x anni_seg                         [t SO/ha]
      Humus formato dai residui alla raccolta (solo residui lasciati in campo):
        SS_res = sostanza secca dei residui aerei [t/ha]  (da resa e indice di raccolta in crops.yaml,
                 convertendo la granella a sostanza secca con la sua umidità)
        C_res  = SS_res x c_residui                                      [t C/ha]
        H_res  = k1_residui(coltura) x C_res x fattore_so_c              [t SO/ha]
        (k1_residui è su base carbonio: kg C umificato per kg C del residuo)
      Humus formato dalla cover crop alla terminazione (cover_crop.yaml):
        C_cov  = SS_cov x biomassa_e_azoto.frazione_carbonio_sostanza_secca   [t C/ha]
                 (SS_cov = biomassa_secca x U_cov / n_assorbito, vedi azoto_bilancio_segmento passo 3bis)
        H_cov  = humus.coefficiente_isoumico x C_cov x fattore_so_c      [t SO/ha]
      Variazione:
        H(fine) = H(inizio) - H_min + H_res + H_cov
      Con k2 costante, H sotto il tetto e apporti costanti A (H_res + H_cov annui) l'equilibrio è H_eq = A / k2.
    k2_suolo: |
      Metodo principale (Regione Emilia-Romagna, Allegato 2 Tab. 1 e nota):
        classe di tessitura -> classi: tendenzialmente_sabbioso = S, SF, FS; franco (medio impasto) = F, FL, FA, FSA;
                tendenzialmente_argilloso = A, AL, FLA, AS, L (classi USDA in italiano, tabella SO p. 66).
        C/N 9-12 -> k2 = suolo.k2.per_tessitura[classe]
        C/N < 9  -> k2 = suolo.k2.cn_basso[classe]   (coincide con l'estremo alto dell'intervallo della nota)
        C/N > 12 -> k2 = suolo.k2.cn_alto[classe]    (ricavato dalla Tab. 1, NON l'estremo basso della nota:
                    la nota darebbe 22 kg N per il franco e 28 per il sabbioso, la tabella dice 20 e 24)
        Regola generale: k2 = n_mineralizzato_disciplinare[classe][C/N] / (H_1% x n_humus x 1000),
                         H_1% = 0,01 x 0,20 x 10000 x densita_apparente_ER[classe]; riproduce la Tab. 1 in tutte le celle.
      Alternativa continua (Machet et al. 1990, riportata dal Mémento Agro-Transfert 2007):
        k2 = 1200 x (0.2 x T - 1) / ((A + 200) x (0.3 x CaCO3 + 200))
        A = argilla [g/kg], CaCO3 = calcare totale [g/kg], T = temperatura media annua dell'aria [°C].
        SoilGrids non fornisce il calcare: senza un dato locale porre CaCO3 = 0 e dichiararlo.
      Nota: i k2 ER sono tassi relativi (1/anno) e si applicano a H calcolato con la densità di soil.yaml; con
      densità 1,433 invece di 1,30 (franco ER) l'N mineralizzato per punto di SO è il 10% più alto della Tab. 1.
    azoto_bilancio_segmento: |
      PASSO GIORNALIERO (dal 2026-11-12; fieldwise.nitrogen.run_daily, nucleo numba, una chiamata per
      rotazione dopo il bilancio idrico). Le voci per segmento (coltura, nudo, cover) sono somme dei flussi
      giornalieri. Stati: N_min, N_res (residui e immobilizzazioni in attesa di rilascio), N_cov (cover viva),
      N_pl (azoto nella coltura in piedi, tra semina e raccolta), H. Ogni giorno, in questo ordine:
      0) Primo giorno di una coltura: credito di precessione CRED della coltura precedente (Tab. 4 ER)
         CRED < 0: immobilizzazione N_min -> N_res di min(|CRED|, N_min), poi rilasciata come al passo 1bis
         CRED > 0: anticipo del rilascio N_res -> N_min di min(CRED, N_res)
      f_T = q10^((T - T_media)/10) (suolo.temperatura.q10; T = temperatura media giornaliera, media di f_T ~ 1)
      1) MIN  = k2 x min(H, H_tetto) / 365 x f_T x n_humus x 1000 ;  H = H - k2 x min(H, H_tetto) / 365 x f_T
         DISP = fattore_dispersione x MIN ;  DEP = deposizione_atmosferica / 365
         N_min = N_min + MIN - DISP + DEP
      1bis) Rilascio programmato: ogni apporto a N_res (N fresco dei residui dopo l'umificazione, N della cover
         alla terminazione, immobilizzazioni) torna a N_min in suolo.residui.giorni_rilascio giorni normalizzati
         dall'evento: quota del giorno = apporto x f_T / giorni_rilascio finche' la somma di f_T arriva a
         giorni_rilascio (assunzione; piu' lento d'inverno, piu' rapido d'estate, massa conservata);
         N_res = somma dei rilasci non ancora avvenuti.
      2) Coltura: U = resa x n_assorbito(coltura) sul ciclo (resa nota dal bilancio idrico e dai fattori);
         u_d = U x q_d con q_d = Tr_d / somma sul ciclo di Tr, Tr_d = traspirazione del giorno calcolata dal
         nucleo idrico (water.py, metodo a doppio coefficiente FAO-56 cap. 7: Tr = Ks x Kcb x ET0 con Kcb di
         crops.<coltura>.kcb, Tab. 17, stessa curva a quattro tratti e stessi punti di passaggio di Kc, eq. 70
         su mid/end): una sola definizione di traspirazione nel motore (WaterResult.tr).
         Regola dichiarata come ASSUNZIONE: la biomassa, e con essa l'azoto assorbito, cresce in proporzione
         alla traspirazione (principio della produttivita' dell'acqua di FAO-33 e AquaCrop/FAO-66, ricordato,
         non riletto per questa regola). Alternative per la sensibilita' (rotation.simulate, argomento
         riparto): 'eta' (ETa) e 'eta_et0' (ETa/ET0).
         u_suolo = min(u_d, N_min); N_min = N_min - u_suolo; N_pl = N_pl + u_suolo
         Mais e frumento: def_d = u_d - u_suolo coperto dal concime del giorno (distribuzione frazionata che
           segue la domanda): FERT_d = def_d / recupero_apparente ; PERD_F_d = FERT_d - def_d ; N_pl += def_d
         Soia (nessun concime): FIX_d = min(u_d - u_suolo, quota_fissazione_max x U - FIX gia' fissato);
           deficit_n_d = u_d - u_suolo - FIX_d (non coperto) ; N_pl += FIX_d
         Controllo normativo sul ciclo: somma FERT x efficienza_concime.minerale_convenzione_normativa <= MAS.
      2bis) Cover: u_cov_d = min(cover_crop.biomassa_e_azoto.n_assorbito x q_d, N_min), q_d = Tr / somma Tr
         sul periodo della cover, Tr = traspirazione del nucleo idrico (Ks x Kcb x ET0 con Kcb = cover_crop.acqua.kcb.ini costante); N_min -> N_cov. Il tetto 0,70 x N_min del passo a fine segmento
         non si usa piu': il limite nasce dal bilancio giornaliero (N_min presente ogni giorno).
      3) Lisciviazione giornaliera: L_d = N_min x (1 - exp(-D_d / ((1 - anion_excl) x SAT_mm))), D_d =
         percolazione profonda del giorno (SWAT eq. 4:2.1.2 e 4:2.1.8, formulata per il passo giornaliero;
         qui con un solo strato = profilo del motore). N_min = N_min - L_d.
      4) Ultimo giorno della coltura (raccolta): U_eff = N_pl ; EXP = resa x n_asportato x U_eff / U ;
         R_N = U_eff - EXP (residui asportati: EXP += R_N, R_N = 0, H_res = 0) ; N_pl = 0
         N_umif = H_res x n_humus x 1000 preso da R_N (deficit da N_min, poi H_res ridotto) ; H = H + H_res
         R_N - N_umif -> N_res, rilasciato come al passo 1bis ; CRED della coltura per la coltura successiva.
      4bis) Ultimo giorno della cover (terminazione): SS_cov = biomassa_secca x U_cov / n_assorbito ;
         IMM_cov = npd_per_t_ss x SS_cov: se < 0 immobilizzazione da N_min di min(|IMM_cov|, N_min) che si
         aggiunge all'N fresco; se > 0 efficienza_campo x IMM_cov passa subito a N_min. N_umif_cov =
         H_cov x n_humus x 1000 dall'N fresco; il resto -> N_res con il rilascio del passo 1bis.
      Chiusura giornaliera e sulla rotazione: DEP + FERT + FIX - (EXP + L + DISP + PERD_F) =
         d(N_min + N_res + N_cov + N_pl + H x n_humus x 1000).
      update_segment (involucro): un segmento solo, con D e assorbimento distribuiti uniformemente sui giorni;
         l'N_res iniziale viene rilasciato in giorni_rilascio dall'inizio del segmento.
    disciplinare_controllo: |
      Per mostrare all'agricoltore la dose 'da disciplinare' (non usata nel bilancio di massa):
        N = A - B + C + D - E - F - G   (Regione Emilia-Romagna, Allegato 2)
        A = resa attesa x n_assorbito ; B = B1 x coefficiente_tempo + B2 ;
        B1 = n_mineralizzato_disciplinare[tessitura][C/N] x min(SO%, 3) ; B2 = n_pronto[tessitura] x N_totale(per mille) ;
        C = Ca + Cb (lisciviazione_disciplinare) ; D = B x fattore_dispersione ; E = credito_precessione ;
        F = residuo di concimazioni organiche (non modellato) ; G = deposizione_atmosferica x coefficiente_tempo (+ fissazione per leguminose).
        Qui il concime è contato con efficienza_concime.minerale_convenzione_normativa (= 1, convenzione dei disciplinari).
  limiti:
    - "Radici e rizodeposizione non sono contabilizzate: n_assorbito e k1_residui riguardano la parte aerea. Salvagiotti et al. (2008) stimano per la soia un 24% dell'azoto totale nelle parti ipogee (Rochester et al. 1998, citazione indiretta)."
    - "Volatilizzazione e denitrificazione dell'azoto mineralizzato sono comprese, insieme all'immobilizzazione, nel fattore_dispersione del disciplinare ER; quelle del concime sono la perdita esplicita PERD_F = FERT x (1 - recupero_apparente). In entrambi i casi l'immobilizzazione è trattata come perdita (stima prudente)."
    - "recupero_apparente è misurato in prova come differenza di assorbimento tra parcella concimata e non concimata: la quota non recuperata comprende anche nitrato rimasto nel suolo e lisciviato. Il motore la toglie tutta come PERD_F e calcola a parte la lisciviazione del N_min residuo: c'è una possibile parziale sovrapposizione (perdite sovrastimate), da esplorare in sensibilità."
    - "Il fattore_dispersione del disciplinare ER si applica a B1+B2 (mineralizzazione + azoto pronto) una volta per coltura; qui si applica solo al flusso di mineralizzazione per non erodere N_min a ogni segmento."
    - "La soia prende dal suolo tutto l'N_disp fino al fabbisogno: in campo una parte del nitrato resta comunque nel suolo. La regola sovrastima la presa dal suolo quando N_disp è alto (e quindi sottostima la fissazione)."
    - "La lisciviazione è calcolata a passo giornaliero ma con un solo strato (SWAT eq. 4:2.1.2 applicata al profilo intero): sottostima il ritardo di trasporto e la stratificazione dei nitrati."
    - "Effluenti zootecnici e ammendanti: solo l'efficienza e il limite di 170 kg N/ha sono riportati; la loro mineralizzazione pluriennale (Tab. 5 e 6 ER) non è modellata."
    - "I coefficienti ER sono letti nelle Norme generali 2023; le modifiche 2025 e 2026 (BUR ER) sono state lette e non toccano queste voci; le modifiche 2024 non sono state lette."
    - "k1 HD per la soia non esiste nelle fonti lette: si usa il valore del pisello proteico (leguminosa da granella) come proxy."
    - "c_residui (frazione di carbonio nella sostanza secca dei residui) è letta solo per la paglia di frumento; per stocchi di mais e residui di soia è un'assunzione."
    - "Fosforo e potassio non sono modellati."
    - "Soia senza concime: se N_disp + FIX < U il fabbisogno non coperto è riportato come deficit_n (con indicatore), ma la resa non viene ridotta; l'asportazione e l'N dei residui si calcolano sull'assorbimento coperto U_eff."
    - "Concime: copre ogni giorno la parte di assorbimento che il suolo non copre (distribuzione frazionata ideale che segue la domanda). L'azoto del concime esposto tra distribuzione e assorbimento (dosi in blocco, lisciviazione dopo la concimazione) non è rappresentato, se non attraverso la perdita esplicita PERD_F = FERT x (1 - recupero_apparente)."
    - "Ripartizione giornaliera dell'assorbimento proporzionale alla traspirazione Ks x Kcb x ET0 calcolata dal bilancio idrico a doppio coefficiente (assunzione dichiarata; dal 2026-11-12 il bilancio idrico e il riparto usano la stessa traspirazione). La concentrazione di N nella biomassa e' trattata come costante nel ciclo (in campo e' piu' alta nelle prime fasi): l'assorbimento precoce e' sottostimato. Con ETa/ET0 (Kc singolo, evaporazione inclusa) il frumento assorbiva il 45% in nov-feb, con la traspirazione il 7%."
    - "Cover: assorbimento proporzionale a Ks x Kcb x ET0 con Kcb costante, cioe' all'ET0 (alta a settembre-ottobre e a marzo, bassa d'inverno); la crescita della copertura nel tempo non e' rappresentata. Misura del 2026-11-12 (doppio coefficiente e CN di AquaCrop; punto pilota, solo pioggia, mediana delle annate, stesso intervallo con e senza cover): il drenaggio e' praticamente uguale (dopo il mais 65 mm nudo, 68 con cover; dopo il frumento 76 e 75), quindi la riduzione della lisciviazione e' tutta un effetto di intercettazione. Lisciviazione per mm drenato ridotta del 51% dopo il mais (10,4 -> 5,5 kg N/ha) e del 62% dopo il frumento (15,1 -> 5,6), con irrigazione libera 43% e 58%. Dopo il mais la riduzione resta sotto il 56-70% pubblicato perche' l'N minerale alla semina della cover e' quasi nullo (mediana 4,4 kg N/ha: il concime non resta nel suolo) e la lisciviazione da intercettare e' solo quella dell'N mineralizzato in autunno-inverno; la cover raggiunge comunque il tetto di 51 kg N/ha. Dopo il frumento (N minerale alla semina 21,6 kg N/ha) la riduzione sta nell'intervallo pubblicato. Nessun parametro e' stato tarato su questo risultato."
    - "Misura del 2026-11-14 dopo l'introduzione del fattore di temperatura (q10 = 2; rotazione mais-soia-frumento, punto pilota, mediana di 17 annate, stesso intervallo nudo e con cover): lisciviazione dopo il mais 9,6 -> 6,2 kg N/ha col suolo nudo e 6,9 -> 2,6 con la cover, riduzione dovuta alla cover 27% -> 58% (tetto irriguo 55%, irrigazione libera 58%); dopo il frumento 9,5 -> 10,4 nudo e 4,1 -> 5,1 con cover, riduzione 56% -> 51%. Con q10 1,7-3 la riduzione dopo il mais varia molto (circa 54-86% nella prova senza credito di precessione): parametro sensibile. Riferimento di campo: Capra et al. (2023, GCB Bioenergy) in pianura padana, segale -64% della lisciviazione autunnale rispetto al suolo nudo. Provato e scartato: applicare il credito negativo degli stocchi (-40 kg N) dalla raccolta invece che alla semina porta la lisciviazione autunnale dopo il mais quasi a zero e rende la cover peggiore del suolo nudo (il credito ER e' un effetto netto sulla coltura successiva, non un'immobilizzazione autunnale). I numeri della misura del 2026-11-12 riportati sopra sono superati."
    - "Mineralizzazione dell'humus e rilascio dei residui modulati dalla temperatura con un Q10 (suolo.temperatura.q10), normalizzato sulla media della serie: si usa la temperatura dell'aria come proxy di quella del suolo; l'umidita' del suolo non e' considerata; il C/N dei singoli residui entra solo attraverso il credito di precessione ER."
    - "La frazione lisciviata usa SAT_mm dell'intero profilo del motore (1,5 m), non della sola zona radicale del segmento."
    - "Il MAS non viene ridotto per rese sotto la resa di riferimento (la nota 112 regola solo il superamento)."
    - "Cover: biomassa e humus proporzionali all'N assorbito (C/N costante) è un'assunzione; n_assorbito della segale è derivato, non misurato."
    - "Lisciviazione probabilmente sottostimata (circa 4-25 kg N/ha/anno nelle rotazioni del punto pilota; per il mais irriguo in pianura padana la letteratura riporta in genere alcune decine di kg): il concime copre la domanda giorno per giorno e non passa mai dall'N minerale, la quota persa del concime e' contata a parte in PERD_F e non nella lisciviazione, e la SAT dell'intero profilo sta al denominatore della frazione lisciviata."
    - "Un solo strato per la lisciviazione (SWAT eq. 4:2.1.2 sul profilo intero di 1,5 m): rispetto allo strato 0-30 cm la lisciviazione per mm drenato e' diluita di circa 5 volte; la SAT dello strato o della zona radicale va esplorata in sensibilita'."
    - "Falda e risalita capillare non modellate (soil._meta.limiti): la percolazione e quindi la lisciviazione sono probabilmente sovrastimate dove la falda e' superficiale, mentre lo stress idrico del mais in asciutto e' sovrastimato."
    - "L'azoto non limita la resa: lo scenario e' 'azoto non limitante, con costo e rischio ambientale espliciti' (concime, PERD_F, superamento del MAS, deficit_n della soia, lisciviazione). Le rotazioni povere di azoto si distinguono per concime e MAS, non per resa; le penalita' di ristoppio possono contenere un effetto azoto gia' rappresentato dal credito di precessione (variante f_rotazione = 1 in sensibilita')."

