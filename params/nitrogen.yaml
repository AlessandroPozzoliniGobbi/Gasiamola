efficienza_concime:
  recupero_apparente:
    mais:
      valore: 0.84
      unita: "kg N assorbito in più / kg N di concime"
      fonte: "Moretti B., Bertora C., Grignani C., Lerda C., Celi L., Sacco D. (2020). Conversion from mineral fertilisation to MSW compost use: nitrogen fertiliser value in continuous maize and test on crop rotation. Science of the Total Environment, doi:10.1016/j.scitotenv.2019.135308"
      riferimento: "Par. 2.2.3, eq. 1 (NAR = [(Y x N)granella + (Y x N)residui] concimato - [idem] non concimato, diviso per la dose); par. 3.1.2 e Fig. 2: NAR del mais con concime minerale (M-Min) 90, 85 e 76% nel 2010, 2011, 2012; in rotazione (R-Min) 91, 88 e 82%"
      url: "https://iris.unito.it/bitstream/2318/1726469/1/STOTEN-D-19-08926.pdf"
      nota: "Media dei tre anni del mais in monosuccessione: (90 + 85 + 76)/3 = 84%. Prova di campo dell'Università di Torino nella pianura padana occidentale; mais FAO 500 in monosuccessione, in media 198 kg N/ha/anno da urea in presemina (par. 2.2.1), confronto con testimone non concimato. Letta la versione d'autore (manoscritto STOTEN-D-19-08926, archivio aperto AperTO), non quella dell'editore. Recupero apparente (metodo della differenza), non recupero isotopico. Sostituisce nel bilancio di massa la convenzione normativa 1,0 (minerale_convenzione_normativa): la quota 1 - 0,84 è la perdita esplicita PERD_F di _meta.equazioni. Valore alto rispetto alla letteratura internazionale (recuperi del primo anno spesso 30-50%, Ladha et al. 2005, Adv. Agron. 87: 85-156, citazione indiretta non letta): l'estremo inferiore dell'intervallo è 0,50."
      verificato: true
      sensibilita: true
      intervallo: [0.50, 0.91]
    frumento:
      valore: 0.57
      unita: "kg N assorbito in più / kg N di concime"
      nota: "Non usato per la soia: nel motore la soia non riceve concime. Nessuna fonte aperta letta con il recupero apparente del concime nel frumento in Pianura Padana; la prova di Moretti et al. (2020) concima il frumento ma riporta il NAR solo per il mais."
      verificato: false
      assunzione: true
      motivazione: "Valore medio delle prove sperimentali sul frumento attribuito a Ladha J.K., Pathak H., Krupnik T.J., Six J., van Kessel C. (2005), Efficiency of fertilizer nitrogen in cereal production: retrospects and prospects, Advances in Agronomy 87: 85-156 (recupero medio del primo anno 57% per il frumento), letto solo come citazione in rassegne successive: l'articolo non è ad accesso aperto e le copie trovate erano bloccate. È più basso del mais di Moretti et al. (2020), coerente con l'assorbimento del frumento concentrato in primavera, quando le piogge disperdono parte del concime."
      sensibilita: true
      intervallo: [0.30, 0.84]
  minerale_convenzione_normativa:
    valore: 1.0
    unita: "-"
    fonte: "Regione Lombardia (2025). D.g.r. 30 aprile 2025 n. XII/4284, Aggiornamento del Programma d'azione regionale nitrati 2024-2027 (zone vulnerabili). BURL Serie Ordinaria n. 19 del 6 maggio 2025"
    riferimento: "Allegato 10, 'Il concetto di bilancio dell'azoto': '(Kc FC) + (Ko FO) = MAS', 'KC ... Si considera uguale a 1'; Tabella 1 'Fertilizzante minerale (FM) 1,00', pp. 101-102"
    url: "https://www.regione.lombardia.it/content/dam/rl/canali-tematici-servizi/10-agricoltura/10-direttiva-nitrati/red-normativa-nitrati-agr/accordion/acc-zone-vulnerabili-2024-2027/Delibera%2030%20aprile%202025%20-%20n.%204284.pdf"
    nota: "Concorde con Regione Emilia-Romagna, Norme generali 2023, Allegato 2, p. 56 ('Per i concimi minerali di sintesi si assume un valore di efficienza del 100%'). CONVENZIONE CONTABILE dei disciplinari (azoto 'efficiente' per il confronto con il MAS), non recupero fisico: si usa SOLO per confrontare la dose FERT con vincoli.mas e per la dose 'da disciplinare'. Il bilancio di massa usa recupero_apparente e la perdita esplicita PERD_F (_meta.equazioni). La prima versione usava 0,70 e una quota residua 0,15, non citate: abbandonate."
    verificato: true
  effluente_bovino:
    valore: 0.50
    unita: "-"
    fonte: "Regione Lombardia (2025). D.g.r. 30 aprile 2025 n. XII/4284, Aggiornamento del Programma d'azione regionale nitrati 2024-2027 (zone vulnerabili). BURL Serie Ordinaria n. 19 del 6 maggio 2025"
    riferimento: "Allegato 10, Tabella 1 'Parametri di Efficienza dell'azoto in rapporto al tipo di matrice', riga 'Bovini da latte o da carne' (liquido, palabile compostato e non), p. 102"
    url: "https://www.regione.lombardia.it/content/dam/rl/canali-tematici-servizi/10-agricoltura/10-direttiva-nitrati/red-normativa-nitrati-agr/accordion/acc-zone-vulnerabili-2024-2027/Delibera%2030%20aprile%202025%20-%20n.%204284.pdf"
    nota: "Riportato per l'uso futuro degli effluenti (zootecnia diffusa nel cremonese); suini e avicoli liquidi 0,60. Non usato nel motore attuale."
    verificato: true

