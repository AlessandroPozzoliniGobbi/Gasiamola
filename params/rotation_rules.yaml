f_rotazione:
  mais_dopo_mais:
    irriguo:
      valore: 0.983
      unita: '-'
      fonte: Seifert C.A., Roberts M.J., Lobell D.B. (2017). Continuous corn and soybean yield penalties across hundreds of
        thousands of fields. Agronomy Journal 109(2), 541-548, doi:10.2134/agronj2016.03.0134 (open access CC BY-NC-ND)
      riferimento: 'Results ''Overall Effects'' (p. 543): penalita'' media del mais continuo irriguo 1.7% (0.20 Mg/ha)'
      url: https://mssoy.org/sites/default/files/documents/seifert-et-al-agron-j-109-2017.pdf
      nota: 'Scenario d''acqua del motore per il mais (crops.mais.irrigabile = 1). La fonte da'' per l''irriguo solo la media
        su tutti gli anni di monosuccessione, non i valori anno per anno: lo stesso fattore si applica al primo ristoppio
        e alla monosuccessione continua. Condizioni della prova: studio osservazionale su 748.374 rese di campi commerciali,
        Midwest USA, 2007-2012, concimazione praticata dagli agricoltori (non controllata). Stime piu'' alte di altre fonti
        nell''intervallo: limite inferiore 1/1.16 = 0.862 (Mudare et al. 2025, cereale dopo precessione non leguminosa contro
        monosuccessione, meta-analisi globale).'
      verificato: true
      sensibilita: true
      intervallo:
      - 0.862
      - 0.983
    asciutto:
      primo_ristoppio:
        valore: 0.981
        unita: '-'
        fonte: Seifert C.A., Roberts M.J., Lobell D.B. (2017). Continuous corn and soybean yield penalties across hundreds
          of thousands of fields. Agronomy Journal 109(2), 541-548, doi:10.2134/agronj2016.03.0134 (open access CC BY-NC-ND)
        riferimento: Results, 'Effects by Years of Continuous Cropping' e Fig. 3 (p. 545)
        url: https://mssoy.org/sites/default/files/documents/seifert-et-al-agron-j-109-2017.pdf
        nota: 'Mais in asciutto (Fig. 3 della fonte): ''Penalties for corn tripled from 1.9 to 5.7% between 1 and 2 yr of
          continuous cropping but then leveled off''. 1 anno di monosuccessione = mais dopo un mais diverso da quello di due
          anni prima: f = 1 - 0.019. Usato solo nello scenario non irriguo. Condizioni della prova come in irriguo (osservazionale,
          Midwest USA, concimazione non controllata). Stime piu'' alte di altre fonti: Mudare et al. 2025 (+16%), Bowles et
          al. 2020 (+28% rotazioni complesse contro semplici). Intervallo = [1 - 0.057, 1 - 0.017].'
        verificato: true
        sensibilita: true
        intervallo:
        - 0.943
        - 0.983
      monosuccessione_continua:
        valore: 0.943
        unita: '-'
        fonte: Seifert C.A., Roberts M.J., Lobell D.B. (2017). Continuous corn and soybean yield penalties across hundreds
          of thousands of fields. Agronomy Journal 109(2), 541-548, doi:10.2134/agronj2016.03.0134 (open access CC BY-NC-ND)
        riferimento: Results, 'Effects by Years of Continuous Cropping' e Fig. 3 (p. 545)
        url: https://mssoy.org/sites/default/files/documents/seifert-et-al-agron-j-109-2017.pdf
        nota: 'Mais in asciutto, dal 2o anno consecutivo di mais in poi: penalita'' 5.7% (''then leveled off''); media generale
          in asciutto 4.3% (0.42 Mg/ha). Usato solo nello scenario non irriguo. Intervallo: dal limite inferiore 1/1.16 =
          0.862 (Mudare et al. 2025, valore globale) a 1 - 0.019 = 0.981.'
        verificato: true
        sensibilita: true
        intervallo:
        - 0.862
        - 0.981
  soia_dopo_soia:
    valore: 0.897
    unita: '-'
    fonte: Seifert C.A., Roberts M.J., Lobell D.B. (2017). Continuous corn and soybean yield penalties across hundreds of
      thousands of fields. Agronomy Journal 109(2), 541-548, doi:10.2134/agronj2016.03.0134 (open access CC BY-NC-ND)
    riferimento: Abstract e Results 'Overall Effects' (pp. 541, 543)
    url: https://mssoy.org/sites/default/files/documents/seifert-et-al-agron-j-109-2017.pdf
    nota: 'Condizione a cui si riferisce il valore: soia continua IN ASCIUTTO, penalita'' media su tutti gli anni di monosuccessione
      10.3% (0.32 Mg/ha); in irriguo 9.6% (0.36 Mg/ha), estremo superiore dell''intervallo (1 - 0.096 = 0.904). La penalita''
      cresce con gli anni di monosuccessione fino a 5 anni, ma il testo non riporta i valori anno per anno (solo Fig. 3, grafico):
      si usa la media per primo ristoppio e monosuccessione continua. Studio osservazionale USA, concimazione non controllata.
      Nello scenario irriguo del motore si puo'' usare 0.904 (sensibilita''). Nota: in Emilia-Romagna il ristoppio di soia
      e'' comunque non conforme.'
    verificato: true
    sensibilita: true
    intervallo:
    - 0.897
    - 0.904
  frumento_dopo_frumento:
    primo_ristoppio:
      valore: 0.875
      unita: '-'
      fonte: 'AHDB - Agriculture and Horticulture Development Board (Regno Unito). Take-all disease in cereals: prevent, detect,
        control (pagina web, consultata il 2026-11-12)'
      riferimento: 'Sezione sulla ''second wheat syndrome'': ''yields of second wheat crops are frequently 10-15% less than
        those of first wheats''; ''losses of 10-20% are common in second and third wheat crops'' (suoli argillosi calcarei)'
      url: https://ahdb.org.uk/knowledge-library/take-all-in-winter-wheat
      nota: 'Frumento dopo un frumento (secondo frumento), con la coltura di due anni prima diversa. f = 1 - 0.125 (punto
        medio di 10-15%); intervallo da 1 - 0.15 a 1 - 0.10. Causa principale: mal del piede (take-all, Gaeumannomyces tritici).
        Fonte di un ente tecnico pubblico britannico (organismo statutario finanziato da contributi obbligatori), categoria
        ''altro'' nella gerarchia del progetto: nessuna fonte italiana o peer-reviewed aperta con la penalita'' del primo
        ristoppio e'' stata trovata. Contesto: frumento in asciutto nel Regno Unito, rese alte; la pressione del mal del piede
        in Pianura Padana non e'' stata verificata. La stessa pagina nota che in monosuccessione di cereali le rese ''generally
        recover, to some extent'' (declino del mal del piede): coerente con una monosuccessione continua (0.82) non piu''
        penalizzata del secondo frumento.'
      verificato: true
      sensibilita: true
      intervallo:
      - 0.85
      - 0.9
    monosuccessione_continua:
      valore: 0.82
      unita: '-'
      fonte: Marini L., St-Martin A., Vico G., Baldoni G., Berti A., Blecharczyk A., Malecka-Jankowiak I., Morari F., Sawinska
        Z., Bommarco R. (2020). Crop rotations sustain cereal yields under a changing climate. Environmental Research Letters
        15, 124011 (open access)
      riferimento: Sez. 3.1 'Yield responses to diverse crop rotations' (p. 5); Tabella 1 (p. 3)
      url: https://doi.org/10.1088/1748-9326/abc651
      nota: 'Vale per la MONOSUCCESSIONE CONTINUA (terzo anno consecutivo di frumento o oltre), non per il singolo ristoppio.
        Condizioni della prova: monocoltura di frumento mantenuta per decenni contro rotazioni di 4-6 anni con medica (Padova
        1989-2009: mais-barbabietola-mais-frumento-medica-medica; Bologna 1967-2011: mais-frumento-mais-frumento-medica x3),
        prove in asciutto, 7 siti europei, 291 anni-sito, NPK minerale raccomandato uguale nei due trattamenti. Testo: ''winter
        and spring cereals produced more under a diverse rotation than under monoculture, 860 and 390 kg ha-1 per year ...
        the benefit of adopting a diverse rotation corresponds to a 20%-25% yield gain''. Conversione: f = 1/(1+0.20...0.25)
        = 0.833...0.800, valore centrale 1/1.225 = 0.82. Il confronto contiene anche l''apporto di N della medica: rispetto
        a mais-soia-frumento la penalita'' e'' probabilmente sovrastimata.'
      verificato: true
      sensibilita: true
      intervallo:
      - 0.8
      - 0.833
precessione_favorevole:
  cereale_dopo_leguminosa_vs_monosuccessione:
    valore: 0.833
    unita: '-'
    fonte: 'Mudare S., Jing J., Makowski D., He X., Liang Z., Sims Z., Wanger T.C., Tilman D., Zhang F., Cong W.F. (2025).
      Crop rotations synergize yield, nutrition, and revenue: a meta-analysis. Nature Communications, doi:10.1038/s41467-025-64567-9'
    riferimento: Results, 'Yield gain varying with functional groups' (Fig. 2a)
    url: https://europepmc.org/article/PMC/PMC12572145
    nota: 'Testo: ''Legume crops increased subsequent cereal crop yield by 20% (CI: 15%-25%)'' rispetto alla monosuccessione;
      f = 1/1.20 = 0.833 (intervallo 1/1.25 ... 1/1.15). Meta-analisi globale (3663 coppie, 1980-2024), non specifica per
      l''Europa. Misura la stessa cosa di f_rotazione vista dall''altro lato: NON va moltiplicata con f_rotazione, serve solo
      come confronto. Il testo nota inoltre che il beneficio della rotazione cala con dosi di N piu'' alte. NON USATO DAL
      MOTORE (usato_dal_motore: false): l''effetto della leguminosa sul cereale successivo e'' gia'' rappresentato dal bilancio
      dell''azoto e dal credito di precessione (nitrogen.yaml); moltiplicarlo per la resa sarebbe un doppio conteggio. Resta
      come informazione e confronto.'
    verificato: true
    sensibilita: true
    intervallo:
    - 0.8
    - 0.87
    usato_dal_motore: false
