# FIELDWISE - regole di avvicendamento e penalita' di rotazione
# Generato da uno script a partire dalle regole trascritte; vedi _meta e docs/fonti_rotation_heat_cover.md
_meta:
  descrizione: Regole di avvicendamento (disciplinari di produzione integrata Lombardia ed Emilia-Romagna 2026), penalita'
    di resa per monosuccessione e famiglie botaniche per mais da granella, soia, frumento tenero.
  compilato_il: '2026-11-11'
  fonti_dettaglio: docs/fonti_rotation_heat_cover.md
  natura_delle_regole: 'I disciplinari di produzione integrata sono ad adesione VOLONTARIA (SQNPI, intervento SRA01 del CSR,
    marchio QC). Una rotazione ''non_conforme'' NON e'' vietata per legge: non da'' diritto ai premi/al marchio. Il motore
    deve mostrarla con l''etichetta ''non conforme al disciplinare'' e non nasconderla. Le avvertenze agronomiche (sezione
    avvertenze) sono un livello distinto: ''sconsigliato'', non ''vietato''.'
  valori_stato_conformita:
  - conforme
  - conforme_solo_in_deroga
  - non_conforme
  come_si_confronta_una_rotazione_triennale_con_una_norma_quinquennale: 'La rotazione triennale A-B-C e'' ripetuta ciclicamente
    (A B C A B C ...). Si valutano TUTTE le finestre di 5 anni consecutivi (una per ciascuna delle 3 fasi del ciclo, cioe''
    per ogni possibile anno di inizio dell''impegno). In ogni finestra: (1) si contano i ristoppi per coltura = coppie di
    anni consecutivi con la stessa coltura o con colture ''analoghe'' (cereali autunno-vernini tra loro); (2) si contano le
    colture principali diverse = generi botanici diversi (ER cap. 7: ''Colture diverse: colture che non appartengono allo
    stesso genere botanico''). La rotazione e'' conforme solo se lo e'' in tutte le finestre: l''ER chiede che la regola delle
    tre colture sia rispettata ''sempre nel corso di tutti gli anni di impegno''. Per l''ER si include nella finestra anche
    l''anno precedente l''impegno (prima adesione: ''deve essere presa in considerazione la coltura dell''anno precedente'').
    Le cover crop, i sovesci e i secondi raccolti non contano e non interrompono un ristoppio (Lombardia punto I; ER cap.
    7: due mais da granella intervallati da un sovescio autunno-vernino restano un ristoppio). Conseguenza per i cicli di
    3 anni: un ciclo con due colture (A-A-B) ha in qualche finestra di 5 anni due ristoppi di A, quindi non e'' mai conforme
    alla norma quinquennale, mentre e'' esplicitamente ammesso dall''impegno triennale lombardo SRA01 2026 (''coltura A -
    coltura A - coltura B'').'
  cosa_vieta_e_cosa_no: 'Tra mais, soia e frumento tenero i disciplinari NON vietano alcuna successione tra colture diverse
    (i divieti di precessione dell''ER riguardano soia con colza, girasole e fagiolo, non le nostre colture). Limitano solo
    i ristoppi e impongono un numero minimo di colture. Differenza tra le due regioni: in Lombardia ogni coltura ammette un
    ristoppio nel quinquennio; in Emilia-Romagna la soia non ammette ristoppio. Nessuna delle due fissa per queste tre colture
    un intervallo minimo di ritorno in anni (intervalli espliciti esistono solo per barbabietola, riso, orticole).'
  uso_dei_fattori_di_resa: 'f_rotazione moltiplica la resa della coltura nell''anno in cui la coltura principale precedente
    e'' la stessa coltura (le cover crop non interrompono il ristoppio). Regola per la rotazione triennale ripetuta (A B C
    A B C ...): il motore guarda le due colture principali precedenti. (1) Coltura precedente diversa: f = 1. (2) Precedente
    uguale e quella di due anni prima diversa: fattore ''primo_ristoppio''. (3) Precedente e quella di due anni prima uguali:
    fattore ''monosuccessione_continua''. In un ciclo A-A-B ricorre solo il caso (2) una volta ogni 3 anni; in A-A-A il caso
    (3) ogni anno dal terzo in poi (e (2) nel secondo anno simulato). Scenario d''acqua: mais irriguo (crops.mais.irrigabile
    = 1) -> mais_dopo_mais.irriguo per (2) e (3); mais non irriguo -> mais_dopo_mais.asciutto.primo_ristoppio e .monosuccessione_continua.
    Soia: soia_dopo_soia (media in asciutto) per (2) e (3) in tutti e due gli scenari; l''irriguo 0.904 e'' in intervallo.
    Frumento (non irriguo): frumento_dopo_frumento.primo_ristoppio per (2), .monosuccessione_continua per (3); un cereale
    autunno-vernino conta come frumento. precessione_favorevole NON si usa (usato_dal_motore: false). Tutti i fattori hanno
    sensibilita: true.'
  limiti: 'Nessuna prova di lungo periodo in Pianura Padana con fattore per il mais in monosuccessione e'' stata leggibile
    ad accesso aperto (Borrelli et al. 2014, Eur. J. Agron. 55:12-19, prova di Lodi dal 1985, e Giacometti et al. 2021, prova
    di Cadriano (BO) dal 1966: testo non accessibile o senza fattore leggibile). Per il mais e la soia il fattore viene quindi
    da un grande studio osservazionale USA (Seifert et al. 2017), per il frumento da prove europee di lungo periodo che includono
    Padova e Bologna (Marini et al. 2020). Per il primo ristoppio del frumento la fonte e'' una sintesi tecnica britannica
    (AHDB), non una prova padana.'
  condizioni_delle_prove: 'mais_dopo_mais e soia_dopo_soia (Seifert et al. 2017): studio osservazionale su rese di campi commerciali
    del Midwest USA 2007-2012 (dati satellitari), irriguo e asciutto separati, concimazione dell''agricoltore non controllata:
    la penalita'' comprende la risposta all''azoto e le differenze di gestione. frumento_dopo_frumento.monosuccessione_continua
    (Marini et al. 2020): prove europee di lungo periodo in asciutto, monocoltura pluridecennale contro rotazioni di 4-6 anni
    con medica, NPK uguale. frumento_dopo_frumento.primo_ristoppio (AHDB): sintesi tecnica britannica sul secondo frumento,
    frumento in asciutto. Possibile doppio conteggio con il bilancio dell''azoto: le penalita'' osservate contengono in parte
    un effetto azoto che il motore calcola gia'' (credito di precessione -40 kg N dopo stocchi): variante f = 1 da provare
    in sensibilita''.'
  rivisto_il: 2026-11-12 (mais irriguo/asciutto, primo ristoppio e monosuccessione del frumento, condizione della soia, precessione
    non usata, successioni_vietate derivate)
