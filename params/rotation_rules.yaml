avvertenze:
  mais_frumento_fusariosi:
    valore: sconsigliato senza interramento dei residui
    unita: '-'
    fonte: Regione Emilia-Romagna (2026). Disciplinari di produzione integrata 2026 - Norme generali (DGR 3130 del 16/02/2026)
    riferimento: Norme tecniche di difesa frumento 2026, 'Fusariosi (Fusarium spp.) - Interventi agronomici'; Allegato 1 Norme
      generali, riga Frumento duro (p. 50)
    url: https://agricoltura.regione.emilia-romagna.it/produzioni-agroalimentari/agricoltura-sostenibile/agricoltura-integrata/Collezione-dpi/dpi_2026/norme-tecniche-di-coltura/erbacee/erbacee/difesa-frumento-2026.pdf/@@download/file
    nota: 'Testo: ''dopo mais e sorgo e'' possibile seminare il frumento duro solo dopo l''interramento dei residui colturali'';
      per alcune cv di tenero (Mieti, Serio, Trofeo) e'' obbligatorio, per le altre cv di frumento tenero ''si consiglia''.
      Il rischio documentato e'' sanitario (fusariosi della spiga, micotossine); nessuna delle fonti lette quantifica una
      penalita'' di resa del frumento dopo mais: NON si applica un fattore, si mostra un''avvertenza. La scheda lombarda di
      difesa del frumento 2026 non contiene questo vincolo (solo ''evitare semine fitte'', ''concimazioni equilibrate'').
      Mais e frumento appartengono alla stessa famiglia (Poaceae) ma a generi diversi: per i disciplinari sono ''colture diverse''.'
    verificato: true
