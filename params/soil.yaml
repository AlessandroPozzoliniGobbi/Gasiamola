ruscellamento:
  metodo:
    valore: "SCS Curve Number, Q = (P - Ia)^2 / (P - Ia + S), S = 25400/CN - 254 mm, Ia = 0,2 S"
    unita: "-"
    fonte: "USDA NRCS (2004). National Engineering Handbook Part 630 Hydrology, Chapter 10 Estimation of Direct Runoff from Storm Rainfall"
    riferimento: "Eq. 10-9 e 10-11; tabella 10-1 (CN per Ia = 0,2 S)"
    url: "https://directives.nrcs.usda.gov/sites/default/files2/1712930608/7300.pdf"
    nota: "AquaCrop v7.3 (cap. 3, eq. 3.7e-f) usa la stessa equazione ma con Ia = 0,05 S e CN diversi (tab. 3.7a); i CN di NEH tab. 9-1 valgono per Ia = 0,2 S e non vanno mescolati con Ia = 0,05 S."
    verificato: true
  gruppo_idrologico:
    valore: "C"
    unita: "-"
    fonte: "USDA NRCS (2009). National Engineering Handbook Part 630 Hydrology, Chapter 7 Hydrologic Soil Groups"
    riferimento: "Tabella 7-1: nessuno strato impermeabile entro 100 cm; falda alta > 60 cm; Ksat dello strato meno permeabile 2,0 micrometri/s (tra 1 e 10 per 0-50 cm, tra 0,4 e 4 per 0-100 cm) -> C"
    url: "https://directives.nrcs.usda.gov/sites/default/files2/1712930597/11905.pdf"
    nota: "Calcolato da fieldwise.soil.hydrologic_soil_group; il risultato e' C per qualsiasi profondita' di falda tra 85 e 170 cm. Con falda < 60 cm diventerebbe C/D. Coerente con la descrizione testuale (gruppo C: 20-40% argilla, < 50% sabbia, tessiture franche)."
    verificato: true
  cn:
