_meta:
  descrizione: "Suolo del punto pilota (lat 45.2, lon 10.0, provincia di Cremona): ingressi SoilGrids 2.0, proprieta' idrauliche Saxton e Rawls (2006), profilo simulato, evaporazione, ruscellamento, drenaggio, condizione iniziale"
  compilato_il: "2026-11-11"
  dati: "SoilGrids 250 m v2.0 via REST (https://rest.isric.org/soilgrids/v2.0/properties/query), scaricato il 2026-11-11T16:25:34Z, sha256 812148f6...1ff1c; aggregati per spessore in data/processed/lat45.200_lon10.000/soilgrids_agg.csv"
  calcolo: "fc, wp, sat, ksat e acqua disponibile sono calcolati da fieldwise.soil (Saxton e Rawls 2006, coefficienti nel codice con il numero di equazione); tests/test_soil.py verifica che i valori qui coincidano con il ricalcolo (tolleranza 5e-4 m3/m3, 0,5% su ksat, 0,5 mm su acqua disponibile)"
  scelte:
    - "Contenuti idrici riferiti alla terra fine: nessuna correzione per lo scheletro (Rv = 0). ERSAF descrive i suoli della bassa pianura cremonese 'senza scheletro'; SoilGrids da' 9-12% vol ma cfvo e' la sua proprieta' meno accurata (MEC 0,31). Con lo scheletro SoilGrids l'acqua disponibile 0-150 cm scende da 215 a 194 mm."
    - "Nessuna correzione per la densita' (DF = 1). La densita' SoilGrids (1,43 g/cm3) darebbe DF = 1,07 nello strato 0-30 cm, ma e' una stima con q05-q95 0,98-1,81. Con DF da SoilGrids: fc 0-30 = 0,318, sat 0,459, ksat 7,4 mm/h, acqua disponibile 0-150 cm 209 mm."
    - "Profilo simulato 0-150 cm in due strati (0-30, 30-150). Lo strato profondo e' la media pesata sullo spessore degli orizzonti SoilGrids 30-100 e 100-150; ksat con la media armonica pesata."
  limiti:
    - "Falda e risalita capillare ignorate. Nella bassa pianura cremonese centrale ERSAF indica suoli limitati dalla falda e/o da orizzonti sabbiosi mediamente tra 110 e 150 cm (Media Pianura: falda tra 85 e 170 cm). In questi suoli la falda d'estate rifornisce la zona radicale per risalita capillare e d'inverno puo' limitare il drenaggio. Ignorarla fa sbagliare il modello in una direzione nota: sovrastima lo stress idrico e il fabbisogno irriguo delle colture a radici profonde (mais, soia) negli anni secchi, sovrastima la percolazione profonda (e quindi la lisciviazione dei nitrati) e sottostima l'umidita' del profilo profondo. L'errore e' maggiore per le rotazioni con mais e minore per i cereali autunno-vernini, che crescono quando la domanda evapotraspirativa e' bassa."
    - "La sostanza organica SoilGrids dello strato 0-30 cm (3,56%) e' circa 1,5 volte quella misurata da ERSAF nei seminativi della zona (13,5 g/kg di carbonio organico, cioe' 2,33% di sostanza organica): vedi sostanza_organica e docs/fonti_soil.md. Decisione del responsabile."
    - "Saxton e Rawls (2006) sono regressioni su orizzonti A USA; l'errore tipico delle pedotransfer sulla singola stima di fc e wp e' dell'ordine di qualche punto percentuale in volume."
    - "Un solo profilo per tutto il campo: nessuna variabilita' spaziale. La tessitura misurata nel sito sperimentale di Luignano (circa 5 km dal punto) e' franco-sabbiosa (sabbia 56%, argilla 10%), molto piu' grossolana della media SoilGrids."

