      intervallo: [88, 91]
  umidita_antecedente:
    arc_i:
      valore: [70, 67, 80]
      unita: "-"
      fonte: "USDA NRCS (2004). National Engineering Handbook Part 630 Hydrology, Chapter 10"
      riferimento: "Tabella 10-1, colonna ARC I per CN(ARC II) = 85, 83, 91"
      url: "https://directives.nrcs.usda.gov/sites/default/files2/1712930608/7300.pdf"
      nota: "Ordine: colture_a_file, cereali_a_paglia, suolo_nudo. NEH cap. 10 tratta ARC I e III come estremi della variabilita' (circa 10 e 90 percentile) e non come funzione dell'umidita' del suolo; la regola con l'umidita' e' quella di AquaCrop (sotto)."
      verificato: true
    arc_iii:
      valore: [94, 93, 97]
      unita: "-"
      fonte: "USDA NRCS (2004). National Engineering Handbook Part 630 Hydrology, Chapter 10"
      riferimento: "Tabella 10-1, colonna ARC III per CN(ARC II) = 85, 83, 91"
      url: "https://directives.nrcs.usda.gov/sites/default/files2/1712930608/7300.pdf"
      nota: "Ordine: colture_a_file, cereali_a_paglia, suolo_nudo."
      verificato: true
    regola_umidita:
      valore: "CN = CN(ARC II) con lo strato 0-30 cm a meta' tra fc e wp; interpolazione lineare verso CN(ARC I) a wp e CN(ARC III) a fc"
      unita: "-"
      fonte: "Raes D., Steduto P., Hsiao T.C., Fereres E. (2026). AquaCrop Version 7.3 Reference Manual, Chapter 3 Calculation procedures. FAO"
      riferimento: "Sez. 3.7.4, testo dopo la tab. 3.7a ed eq. 3.7g-3.7i"
