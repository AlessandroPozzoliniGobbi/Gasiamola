    motivazione: "Al 1 gennaio il profilo si assume alla capacita' di campo (frazione 1 dell'acqua disponibile, esaurimento iniziale 0). In dicembre-gennaio nella pianura padana le piogge superano l'evapotraspirazione e i campi sono senza coltura o con cereali appena emersi, quindi il profilo tende a ricaricarsi; FAO-56 (cap. 8, 'Initial depletion', eq. 87) ammette Dr ~ 0 dopo piogge abbondanti (https://www.fao.org/4/x0490e/x0490e0e.htm). L'intervallo 0,5-1,0 va esplorato in sensibilita'; l'effetto si esaurisce con le piogge invernali e conta soprattutto nella prima annata simulata."
    nota: "Riferita a ciascuno dei due strati: theta = wp + frazione x (fc - wp)."
    verificato: false
    intervallo: [0.5, 1.0]
