      valore: 13.5
      unita: "g/kg"
      fonte: "ERSAF Lombardia (2024). Piano di monitoraggio dei suoli e dei sistemi agricoli 2020-2023 - Rapporto finale"
      riferimento: "Tab. 19, carbonio organico 0-30 cm nei campionamenti 2020-2023, Focus Area Bassa Pianura Centrale: 13,5 +/- 4,7 g/kg"
      url: "https://www.ersaf.lombardia.it/wp-content/uploads/2024/12/Rapporto-Monitoraggio_suoli_20-23_def.pdf"
      nota: "Decisione del responsabile (vedi _meta.scelte). Media Pianura 14,7 +/- 3,7 g/kg; pianura totale 15,6 +/- 6,6. Valore SoilGrids (soc mean 0-30 cm, media pesata) 20,67 g/kg, nell'intervallo; il limite superiore e' il q95 SoilGrids. Focus Area dedotta dalla posizione dei comuni campionati (docs/fonti_soil.md)."
      verificato: true
      sensibilita: true
      intervallo: [13.5, 48.18]
    sostanza_organica:
      valore: 2.327
      unita: "% peso"
      fonte: "ERSAF Lombardia (2024). Piano di monitoraggio dei suoli e dei sistemi agricoli 2020-2023 - Rapporto finale"
      riferimento: "Tab. 19, Bassa Pianura Centrale, carbonio organico 0-30 cm 13,5 g/kg; x 1,724 (fattore di van Bemmelen, come fieldwise.data.soilgrids e nitrogen.suolo.fattore_so_c)"
      url: "https://www.ersaf.lombardia.it/wp-content/uploads/2024/12/Rapporto-Monitoraggio_suoli_20-23_def.pdf"
      nota: "13,5 / 10 x 1,724 = 2,327%. Conflitto di fonti risolto dal responsabile con la gerarchia (ente pubblico italiano che misura in zona prima di un prodotto globale). Valore SoilGrids: soc 0-30 cm 20,67 g/kg x 1,724 = 3,563% (Poggio et al. 2021, servizio REST ISRIC, download 2026-11-11), nell'intervallo, circa 1,5 volte ERSAF. Conferma: lo stock medio ERSAF dei seminativi lombardi, 57 t C/ha in 0-30 cm (ERSAF 2008), corrisponde a circa 13 g/kg con densita' 1,43. Effetto del valore SoilGrids: fc 0-30 0,3255 invece di 0,3146, wp 0,1722 invece di 0,1662, acqua disponibile 0-30 46,0 invece di 44,5 mm, humus 0-30 cm 153 invece di 100 t/ha (densita' 1,433). Limite superiore = q95 SoilGrids."
      verificato: true
      sensibilita: true
      intervallo: [2.327, 8.307]
    densita_apparente:
      valore: 1.433
      unita: "g/cm3"
      fonte: "Poggio L. et al. (2021). SoilGrids 2.0. SOIL 7:217-240; servizio REST ISRIC v2.0, download 2026-11-11"
