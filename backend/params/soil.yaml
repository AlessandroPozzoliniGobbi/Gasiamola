      valore: 0.2
      unita: "-"
      fonte: "USDA NRCS (2004). National Engineering Handbook Part 630 Hydrology, Chapter 10 Estimation of Direct Runoff from Storm Rainfall"
      riferimento: "Eq. 10-9 e 10-11, Ia = 0,2 S (tabella 10-1 per Ia = 0,2 S)"
      url: "https://directives.nrcs.usda.gov/sites/default/files2/1712930608/7300.pdf"
      nota: "Rapporto Ia/S da usare con i CN per copertura (cn.*). Fonte non riaperta in questa sessione: il valore e' quello gia' verificato nella voce 'metodo'."
      verificato: false
      sensibilita: true
  metodo:
    valore: "SCS Curve Number, Q = (P - Ia)^2 / (P - Ia + S), S = 25400/CN - 254 mm, Ia = 0,2 S"
    unita: "-"
    fonte: "USDA NRCS (2004). National Engineering Handbook Part 630 Hydrology, Chapter 10 Estimation of Direct Runoff from Storm Rainfall"
    riferimento: "Eq. 10-9 e 10-11; tabella 10-1 (CN per Ia = 0,2 S)"
    url: "https://directives.nrcs.usda.gov/sites/default/files2/1712930608/7300.pdf"
    nota: "Forma dell'equazione per entrambe le famiglie di CN (metodo_cn). AquaCrop v7.3 (cap. 3, eq. 3.7e-f) usa la stessa equazione con Ia = 0,05 S e CN del solo suolo (tab. 3.7a, default del motore); i CN di NEH tab. 9-1 (cn.*) valgono per Ia = 0,2 S e non vanno mescolati con Ia = 0,05 S. Il rapporto Ia/S e' un parametro (aquacrop.ia_su_s, neh.ia_su_s). Il CN e' applicato alla pioggia giornaliera (prassi SWAT; NEH ragiona per evento)."
