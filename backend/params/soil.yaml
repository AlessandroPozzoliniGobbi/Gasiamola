    verificato: true
    sensibilita: true
  aquacrop:
    cn:
      valore: 72
      unita: "-"
      fonte: "Raes D., Steduto P., Hsiao T.C., Fereres E. (2026). AquaCrop Version 7.3 Reference Manual, Chapter 3 Calculation procedures. FAO"
      riferimento: "Sez. 3.7.4, Tab. 3.7a (p. 3-61): gruppo C, Ksat dello strato superficiale 346-36 mm/day, CN default per AMC II = 72 (con Ia = 5% di S)"
      url: "https://www.fao.org/docs/devbuildingforwardbetterlibraries/default-document-library/chapter3aquacropv73.pdf"
      nota: "Ksat dello strato 0-30 cm = 8,97 mm/h = 215 mm/giorno (profilo.strato_superficiale) -> gruppo C. Il manuale: i CN di default sono la media dei quattro gruppi per il complesso 'small grain' in buone condizioni idrologiche del NEH (USDA 2004). Vale per tutte le superfici (coltura, cover, suolo nudo)."
      verificato: true
      sensibilita: true
      intervallo: [61, 77]
    ia_su_s:
      valore: 0.05
      unita: "-"
      fonte: "Raes D., Steduto P., Hsiao T.C., Fereres E. (2026). AquaCrop Version 7.3 Reference Manual, Chapter 3 Calculation procedures. FAO"
      riferimento: "Sez. 3.7.4, eq. 3.7e-f (p. 3-61): 'The initial abstraction (Ia) in Eq. 3.7e is fixed at 0.05 S. Recent research (Hawkins et al., 2002) found that this may be a more appropriate value for Ia than the previous assumed value of 0.20S'"
      url: "https://www.fao.org/docs/devbuildingforwardbetterlibraries/default-document-library/chapter3aquacropv73.pdf"
      nota: "Rapporto Ia/S da usare con aquacrop.cn. Con CN 72 e Ia = 0,2 S il ruscellamento sarebbe circa un decimo: CN e Ia/S vanno cambiati insieme."
      verificato: true
      sensibilita: true
      intervallo: [0.05, 0.2]
  neh:
