      url: "https://rest.isric.org/soilgrids/v2.0/properties/query?lon=10.0&lat=45.2"
      nota: "Non usata nella correzione di Saxton-Rawls (DF = 1, vedi _meta.scelte); usata per lo stock di humus. Densita' normale di Saxton-Rawls per questo strato 1,42 g/cm3 con la SO ERSAF (DF = 1,01; con la SO SoilGrids 1,34 e DF = 1,07). FerSoil (2009) assume 1,4 t/m3 per i suoli dei siti sperimentali."
